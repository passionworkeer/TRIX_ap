<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Canvas Test 2</title>
<style>
canvas { background: white; border: 2px solid red; }
</style>
</head>
<body style="margin:0; background:orange; padding:20px">
<h1>Canvas Test</h1>
<p id="status">Loading...</p>
<canvas id="c" width="400" height="200"></canvas>
<script>
document.getElementById('status').textContent = 'Script started';
try {
  var canvas = document.getElementById('c');
  document.getElementById('status').textContent += ' | canvas found: ' + canvas.tagName;
  var ctx = canvas.getContext('2d');
  document.getElementById('status').textContent += ' | ctx: ' + (typeof ctx) + ' | null? ' + (ctx === null);
  if (ctx) {
    ctx.fillStyle = '#0000FF';
    ctx.fillRect(0, 0, 400, 200);
    ctx.fillStyle = '#FFFF00';
    ctx.font = 'bold 30px Arial';
    ctx.fillText('HELLO', 100, 120);
    document.getElementById('status').textContent += ' | DRAW DONE';
  } else {
    document.body.appendChild(document.createTextNode('CTX IS NULL - canvas API failed'));
  }
} catch(e) {
  document.getElementById('status').textContent += ' | ERROR: ' + e.message + ' ' + e.description;
}
</script>
</body>
</html>
