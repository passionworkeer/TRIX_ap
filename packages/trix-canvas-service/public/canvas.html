<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TRIX Canvas</title>
  <style>
    :root {
      --bg: #0a0a0f;
      --surface: #13131c;
      --border: #22223a;
      --accent: #8b5cf6;
      --accent2: #06b6d4;
      --text: #e2e8f0;
      --muted: #64748b;
      --danger: #ef4444;
      --success: #22c55e;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    /* header */
    header {
      position: sticky; top: 0; z-index: 10;
      background: rgba(10,10,15,.9); backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 0 24px; height: 56px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .logo { font-size: 18px; font-weight: 700; color: var(--accent); letter-spacing: -.5px; }
    .logo span { color: var(--accent2); }
    .header-actions { display: flex; gap: 12px; align-items: center; }
    .btn {
      padding: 6px 16px; border-radius: 8px; border: none; cursor: pointer;
      font-size: 13px; font-weight: 500; transition: all .15s;
    }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: #7c3aed; }
    .btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
    .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }
    .project-id { font-size: 11px; color: var(--muted); font-family: monospace; }

    /* layout */
    .container { max-width: 1200px; margin: 0 auto; padding: 32px 24px; }

    /* project header */
    .project-header { margin-bottom: 32px; }
    .project-header h1 { font-size: 28px; font-weight: 700; margin-bottom: 8px; }
    .project-meta { display: flex; gap: 16px; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
    .project-meta .tag { background: var(--surface); border: 1px solid var(--border); padding: 3px 10px; border-radius: 20px; }
    .project-url { font-size: 12px; color: var(--accent); font-family: monospace; cursor: pointer; }
    .project-url:hover { text-decoration: underline; }

    /* sessions list */
    .section-title { font-size: 16px; font-weight: 600; margin-bottom: 16px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
    .sessions { display: flex; flex-direction: column; gap: 16px; }

    /* session card */
    .session-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
      padding: 20px 24px; transition: border-color .2s;
    }
    .session-card:hover { border-color: var(--accent); }
    .session-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; gap: 12px; }
    .session-prompt { font-size: 15px; line-height: 1.6; flex: 1; }
    .session-status {
      font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 20px;
      white-space: nowrap; text-transform: uppercase; letter-spacing: .5px;
    }
    .status-pending    { background: #1e1e2e; color: var(--muted); }
    .status-generating { background: #1e2a1e; color: #84cc16; }
    .status-completed  { background: #1e2a1e; color: var(--success); }
    .status-error      { background: #2a1e1e; color: var(--danger); }

    /* media grid */
    .media-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; margin-bottom: 12px; }
    .media-item {
      border-radius: 12px; overflow: hidden; background: var(--bg);
      border: 1px solid var(--border); aspect-ratio: 1;
      position: relative; cursor: pointer;
    }
    .media-item img, .media-item video { width: 100%; height: 100%; object-fit: cover; display: block; }
    .media-item .overlay {
      position: absolute; inset: 0; background: rgba(0,0,0,.5);
      display: flex; align-items: center; justify-content: center;
      opacity: 0; transition: opacity .2s; gap: 8px;
    }
    .media-item:hover .overlay { opacity: 1; }
    .media-item .play-icon { width: 36px; height: 36px; background: rgba(255,255,255,.2); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; }
    .media-item video { object-fit: contain; }

    /* messages */
    .messages { border-top: 1px solid var(--border); padding-top: 12px; }
    .message { font-size: 13px; padding: 6px 0; display: flex; gap: 10px; align-items: flex-start; }
    .message .role { font-weight: 600; min-width: 60px; }
    .role-user   { color: var(--accent2); }
    .role-assistant { color: var(--accent); }
    .role-tool   { color: var(--success); }
    .message .text { color: var(--muted); word-break: break-all; }
    .message a { color: var(--accent); text-decoration: none; font-family: monospace; font-size: 12px; }
    .message a:hover { text-decoration: underline; }

    /* empty */
    .empty-state {
      text-align: center; padding: 80px 20px; color: var(--muted);
    }
    .empty-state .icon { font-size: 48px; margin-bottom: 16px; opacity: .5; }
    .empty-state h3 { font-size: 18px; color: var(--text); margin-bottom: 8px; }
    .empty-state p { font-size: 14px; }

    /* lightbox */
    .lightbox {
      display: none; position: fixed; inset: 0; z-index: 100;
      background: rgba(0,0,0,.92); align-items: center; justify-content: center;
      flex-direction: column; gap: 16px;
    }
    .lightbox.open { display: flex; }
    .lightbox img, .lightbox video { max-width: 90vw; max-height: 85vh; border-radius: 12px; }
    .lightbox-close {
      position: absolute; top: 20px; right: 24px;
      background: rgba(255,255,255,.1); border: none; color: #fff;
      font-size: 28px; width: 44px; height: 44px; border-radius: 50%; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .lightbox-close:hover { background: rgba(255,255,255,.2); }
    .lightbox-download {
      background: var(--accent); color: #fff; border: none;
      padding: 10px 24px; border-radius: 10px; font-size: 14px; cursor: pointer;
    }
    .lightbox-download:hover { background: #7c3aed; }

    /* project list */
    .project-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
    .project-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
      padding: 20px; cursor: pointer; transition: all .2s;
    }
    .project-card:hover { border-color: var(--accent); transform: translateY(-2px); }
    .project-card h3 { font-size: 15px; font-weight: 600; margin-bottom: 8px; }
    .project-card p { font-size: 12px; color: var(--muted); }
    .project-card .stats { display: flex; gap: 12px; margin-top: 12px; font-size: 12px; color: var(--muted); }
    .project-card .stats span { display: flex; align-items: center; gap: 4px; }

    /* loading */
    .loading { text-align: center; padding: 40px; color: var(--muted); }
    .spinner { width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto 12px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<header>
  <div class="logo">TRIX <span>Canvas</span></div>
  <div class="header-actions">
    <button class="btn btn-ghost" onclick="location.href='/'">← 返回列表</button>
    <button class="btn btn-primary" onclick="copyProjectUrl()">复制画布链接</button>
  </div>
</header>

<main class="container" id="app">
  <div class="loading"><div class="spinner"></div>加载中...</div>
</main>

<!-- Lightbox -->
<div class="lightbox" id="lightbox" onclick="if(event.target!==this)return;closeLightbox()">
  <button class="lightbox-close" onclick="closeLightbox()">×</button>
  <img id="lightbox-img" src="" alt="" style="display:none" />
  <video id="lightbox-video" controls style="display:none"></video>
  <button class="lightbox-download" onclick="downloadLightbox()">下载</button>
</div>

<script>
const BASE = window.location.origin;
let currentProjectId = new URLSearchParams(location.search).get('projectId');
let currentProject = null;
let lightboxUrl = '';

// ========== 渲染 ==========

function render() {
  const app = document.getElementById('app');
  if (!currentProjectId) {
    renderProjectList(app);
  } else {
    renderProject(app);
  }
}

async function renderProjectList(el) {
  el.innerHTML = '<div class="loading"><div class="spinner"></div>加载项目...</div>';
  try {
    const resp = await fetch(`${BASE}/api/projects`);
    const { data: projects } = await resp.json();
    if (!projects.length) {
      el.innerHTML = `
        <div class="empty-state">
          <div class="icon">📁</div>
          <h3>暂无项目</h3>
          <p>通过 TRIX Agent 创建第一个生成任务，即可在此看到结果</p>
        </div>`;
      return;
    }
    el.innerHTML = `
      <div class="project-header">
        <h1>所有项目</h1>
        <p style="color:var(--muted);font-size:14px;margin-top:4px">共 ${projects.length} 个项目</p>
      </div>
      <div class="project-list">
        ${projects.map(p => `
          <div class="project-card" onclick="location.href='?projectId=${p.id}'">
            <h3>${escHtml(p.name)}</h3>
            <p>${fmtDate(p.updatedAt)}</p>
            <div class="stats">
              <span>📝 ${p.sessionCount} 个会话</span>
              <span class="project-url" onclick="event.stopPropagation();copyUrl('${p.canvasUrl}')">🔗 复制链接</span>
            </div>
          </div>
        `).join('')}
      </div>`;
  } catch(e) {
    el.innerHTML = `<div class="empty-state"><div class="icon">⚠️</div><h3>加载失败</h3><p>${e.message}</p></div>`;
  }
}

async function renderProject(el) {
  el.innerHTML = '<div class="loading"><div class="spinner"></div>加载项目...</div>';
  try {
    const resp = await fetch(`${BASE}/api/project/${currentProjectId}`);
    if (!resp.ok) {
      if (resp.status === 404) {
        el.innerHTML = `<div class="empty-state"><div class="icon">🔍</div><h3>项目不存在</h3><p>ID: ${escHtml(currentProjectId)}</p></div>`;
        return;
      }
      throw new Error('加载失败');
    }
    const { data: project } = await resp.json();
    currentProject = project;

    el.innerHTML = `
      <div class="project-header">
        <h1>${escHtml(project.name || project.id)}</h1>
        <div class="project-meta">
          <span class="tag">📅 ${fmtDate(project.createdAt)}</span>
          <span class="tag">📝 ${project.sessions.length} 个会话</span>
          <span class="project-url" onclick="copyUrl('${project.canvasUrl || location.href}')">🔗 复制画布链接</span>
        </div>
      </div>
      <div class="section-title">生成记录</div>
      <div class="sessions">
        ${project.sessions.length ? project.sessions.map(s => renderSessionCard(s)).join('') : `
          <div class="empty-state" style="padding:40px 0">
            <p>暂无生成记录</p>
          </div>`}
        <div class="project-url" style="text-align:center;margin-top:8px">📋 projectId: ${escHtml(project.id)}</div>
      </div>`;
  } catch(e) {
    el.innerHTML = `<div class="empty-state"><div class="icon">⚠️</div><h3>加载失败</h3><p>${e.message}</p></div>`;
  }
}

function renderSessionCard(session) {
  const statusMap = {
    pending:    ['pending',    '等待中'],
    generating: ['generating', '生成中'],
    completed:  ['completed',  '已完成'],
    error:      ['error',      '失败'],
  };
  const [cls, label] = statusMap[session.status] || ['pending', session.status || '未知'];
  const urls = session.resultUrls || extractUrls(session.messages);

  return `
    <div class="session-card">
      <div class="session-top">
        <div class="session-prompt">${escHtml(session.messages?.[0]?.content || '无描述')}</div>
        <span class="session-status status-${cls}">${label}</span>
      </div>
      ${urls.length ? `
        <div class="media-grid">
          ${urls.map(url => renderMediaItem(url)).join('')}
        </div>` : ''}
      <div class="messages">
        ${(session.messages || []).slice(1).map(m => `
          <div class="message">
            <span class="role role-${escHtml(m.role)}">${escHtml(m.role)}:</span>
            <span class="text">${formatContent(m.content, url => `<a href="${escAttr(url)}" target="_blank">${escHtml(shortenUrl(url))}</a>`)}</span>
          </div>`).join('')}
      </div>
      <div style="font-size:11px;color:var(--muted);margin-top:8px">
        taskId: ${escHtml(session.taskId || '—')} &nbsp;|&nbsp; session: ${escHtml(session.id)}
      </div>
    </div>`;
}

function renderMediaItem(url) {
  const ext = url.split('?')[0].toLowerCase();
  const isVideo = /\.(mp4|mov|webm|avi|mkv)$/.test(ext);
  if (isVideo) {
    return `<div class="media-item" onclick="openLightbox('${escAttr(url)}','video')">
      <video src="${escAttr(url)}" muted preload="metadata"></video>
      <div class="overlay"><div class="play-icon">▶</div></div>
    </div>`;
  }
  return `<div class="media-item" onclick="openLightbox('${escAttr(url)}','img')">
    <img src="${escAttr(url)}" loading="lazy" alt="生成结果" />
    <div class="overlay"><div class="play-icon">🔍</div></div>
  </div>`;
}

// ========== 工具函数 ==========

function extractUrls(messages) {
  if (!messages) return [];
  const urls = [];
  const pattern = /https?:\/\/[^\s"'<>]+\.(?:png|jpg|jpeg|webp|gif|mp4|mov|webm)(\?[^"'<>]*)?/gi;
  messages.forEach(m => {
    if (m.content) {
      let match;
      while ((match = pattern.exec(m.content)) !== null) urls.push(match[0]);
    }
    if (Array.isArray(m.resultUrls)) m.resultUrls.forEach(u => { if (!urls.includes(u)) urls.push(u); });
  });
  return [...new Set(urls)];
}

function escHtml(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function escAttr(s) {
  if (!s) return '';
  return String(s).replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function shortenUrl(url) {
  const u = new URL(url); return u.pathname.split('/').pop() || url;
}
function fmtDate(iso) {
  if (!iso) return '—';
  return new Date(iso).toLocaleString('zh-CN', { month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' });
}
function formatContent(text, urlFn) {
  if (!text) return '';
  const urlRegex = /https?:\/\/[^\s<>"]+/g;
  return escHtml(text).replace(urlRegex, m => urlFn(m));
}

// ========== Lightbox ==========
function openLightbox(url, type) {
  lightboxUrl = url;
  const img = document.getElementById('lightbox-img');
  const vid = document.getElementById('lightbox-video');
  img.style.display = 'none'; vid.style.display = 'none';
  if (type === 'img') { img.src = url; img.style.display = 'block'; }
  else { vid.src = url; vid.style.display = 'block'; }
  document.getElementById('lightbox').classList.add('open');
}
function closeLightbox() { document.getElementById('lightbox').classList.remove('open'); }
function downloadLightbox() {
  if (!lightboxUrl) return;
  const a = document.createElement('a'); a.href = lightboxUrl; a.download = ''; a.target = '_blank'; a.click();
}

// ========== 复制 ==========
async function copyUrl(url) {
  try { await navigator.clipboard.writeText(url); alert('已复制: ' + url); }
  catch { prompt('复制链接:', url); }
}
function copyProjectUrl() { copyUrl(location.href); }

// ========== 启动 ==========
render();
</script>
</body>
</html>
