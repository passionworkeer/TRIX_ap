<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>TRIX Canvas</title>
<style>
:root{--bg:#0a0a0f;--cb:#06060b;--sf:#111120;--nb:#161625;--bd:#252538;--ac:#7c3aed;--ac2:#06b6d4;--txt:#e2e8f0;--mt:#64748b;--err:#ef4444;--ok:#22c55e}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--txt);overflow:hidden;height:100vh;display:flex;flex-direction:column}
.tb{height:50px;background:var(--sf);border-bottom:1px solid var(--bd);display:flex;align-items:center;padding:0 12px;gap:8px;flex-shrink:0}
.logo{font-size:14px;font-weight:800}
.logo span{background:linear-gradient(135deg,#7c3aed,#06b6d4);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.pills{display:flex;gap:5px;flex:1;overflow-x:auto;align-items:center}
.pill{padding:3px 10px;border-radius:16px;border:1px solid var(--bd);background:var(--nb);font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap;color:var(--mt);display:flex;align-items:center;gap:4px;transition:all .12s}
.pill:hover{border-color:var(--ac);color:var(--txt)}
.pill.on{background:rgba(124,58,237,.15);border-color:var(--ac);color:#a78bfa}
.dot{width:5px;height:5px;border-radius:50%;flex-shrink:0}
.dg{background:var(--ok)}.dy{background:#84cc16;animation:dp 1s infinite}
.dr{background:var(--err)}.dgy{background:var(--mt)}
@keyframes dp{0%,100%{opacity:1}50%{opacity:.4}}
.btn{width:30px;height:30px;border-radius:7px;border:1px solid var(--bd);background:var(--nb);color:var(--mt);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;transition:all .12s;flex-shrink:0;font-family:inherit}
.btn:hover{border-color:var(--ac);color:var(--txt)}
.lay{display:flex;flex:1;overflow:hidden}
.lp{width:224px;min-width:224px;border-right:1px solid var(--bd);background:var(--sf);display:flex;flex-direction:column;overflow:hidden}
.ls{padding:10px 12px;border-bottom:1px solid var(--bd)}
.ll{font-size:10px;font-weight:700;color:var(--mt);text-transform:uppercase;letter-spacing:.7px;margin-bottom:6px}
.ta{width:100%;background:var(--nb);border:1px solid var(--bd);border-radius:7px;padding:7px 9px;color:var(--txt);font-size:12px;font-family:inherit;resize:none;outline:none;min-height:54px;line-height:1.5}
.ta:focus{border-color:var(--ac)}
.ta::placeholder{color:var(--mt)}
.fg{display:flex;flex-direction:column;gap:5px;margin-top:6px}
.fr{display:flex;gap:4px}
.sel{flex:1;background:var(--nb);border:1px solid var(--bd);border-radius:5px;padding:5px 6px;color:var(--txt);font-size:11px;font-family:inherit;outline:none}
.sel:focus{border-color:var(--ac)}
.btnG{width:100%;padding:7px;border-radius:7px;border:none;background:linear-gradient(135deg,#7c3aed,#6d28d9);color:#fff;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;transition:filter .12s}
.btnG:hover{filter:brightness(1.1)}
.btnG:disabled{opacity:.5;cursor:not-allowed}
.nl{flex:1;overflow-y:auto;padding:6px}
.ni{padding:6px 8px;border-radius:6px;cursor:pointer;margin-bottom:2px;border:1px solid transparent;display:flex;align-items:center;gap:7px;transition:all .1s}
.ni:hover{background:var(--nb);border-color:var(--bd)}
.ni.on{background:rgba(124,58,237,.12);border-color:rgba(124,58,237,.3)}
.nth{width:32px;height:32px;border-radius:5px;object-fit:cover;background:#0f0f1a;border:1px solid var(--bd);flex-shrink:0}
.nb2{flex:1;min-width:0}
.nt2{font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.nm2{font-size:10px;color:var(--mt);margin-top:1px;display:flex;align-items:center;gap:3px}
.ndot{width:5px;height:5px;border-radius:50%;flex-shrink:0}
.cw{flex:1;position:relative;overflow:hidden;background:#0f0f1a;background-image:radial-gradient(circle,#1a1a30 1px,transparent 1px);background-size:26px 26px}
canvas{display:block;background:#0a0a0f}
.zc{position:absolute;bottom:12px;left:12px;display:flex;flex-direction:column;align-items:center;gap:2px}
.zl{font-size:9px;color:var(--mt)}
.dp{position:absolute;top:0;right:0;width:290px;height:100%;background:var(--sf);border-left:1px solid var(--bd);z-index:20;display:none;flex-direction:column;overflow:hidden}
.dp.on{display:flex}
.dh{padding:11px 13px;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.dh h3{font-size:13px;font-weight:700}
.dcl{background:none;border:none;color:var(--mt);font-size:18px;cursor:pointer;padding:0;line-height:1}
.di{width:100%;aspect-ratio:1;object-fit:contain;background:#0f0f1a;cursor:zoom-in;flex-shrink:0}
.db{flex:1;overflow-y:auto;padding:11px 13px}
.dr{margin-bottom:10px}
.dl2{font-size:9px;font-weight:700;color:var(--mt);text-transform:uppercase;letter-spacing:.6px;margin-bottom:4px}
.dv{font-size:12px;line-height:1.5;word-break:break-all;background:var(--nb);border:1px solid var(--bd);border-radius:6px;padding:6px 8px}
.da{padding:9px 13px;border-top:1px solid var(--bd);display:flex;gap:6px;flex-shrink:0}
.da button{flex:1;padding:6px;border-radius:6px;border:1px solid var(--bd);background:var(--nb);color:var(--txt);font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .12s}
.da button:hover{border-color:var(--ac);color:var(--ac)}
.lb{display:none;position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.96);align-items:center;justify-content:center;flex-direction:column}
.lb.on{display:flex}
.lb img{max-width:92vw;max-height:90vh;object-fit:contain;border-radius:6px}
.lbc{position:absolute;top:10px;right:12px;background:rgba(255,255,255,.1);border:none;color:#fff;font-size:18px;width:32px;height:32px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center}
.ta2{position:fixed;bottom:16px;right:16px;background:var(--sf);border:1px solid var(--bd);color:var(--txt);padding:7px 14px;border-radius:7px;font-size:12px;font-weight:600;z-index:100;opacity:0;transform:translateY(6px);transition:all .2s;pointer-events:none}
.ta2.on{opacity:1;transform:translateY(0)}
.ta2.ok{border-color:rgba(34,197,94,.4)}
.ta2.er{border-color:rgba(239,68,68,.4);color:var(--err)}
</style>
</head>
<body>

<div class="tb">
  <div class="logo">TRIX <span>Canvas</span></div>
  <div class="pills" id="pills"></div>
  <button class="btn" onclick="newP()" title="新项目">+</button>
  <button class="btn" onclick="rld()" title="刷新">&#x21BB;</button>
</div>

<div class="lay">
  <div class="lp">
    <div class="ls">
      <div class="ll">&#x1F3A8; 新建生成</div>
      <textarea class="ta" id="tA" placeholder="描述想生成的图片或视频..."></textarea>
      <div class="fg">
        <div class="fr">
          <select class="sel" id="tS">
            <option value="image">&#x1F5FC; 图片</option>
            <option value="video">&#x1F3AC; 视频</option>
          </select>
          <select class="sel" id="sS">
            <option value="日式动漫">日式动漫</option>
            <option value="吉卜力">吉卜力</option>
            <option value="写实摄影">写实摄影</option>
            <option value="赛博朋克">赛博朋克</option>
            <option value="水墨画">水墨画</option>
          </select>
        </div>
        <select class="sel" id="aS">
          <option value="1:1">1:1 方形</option>
          <option value="16:9">16:9 横版</option>
          <option value="9:16">9:16 竖版</option>
        </select>
        <button class="btnG" id="gB" onclick="subG()">&#x25B6; 生成</button>
      </div>
    </div>
    <div class="ls"><div class="ll">&#x1F4C1; 节点 (<span id="nCnt">0</span>)</div></div>
    <div class="nl" id="nL"></div>
  </div>

  <div class="cw" id="cW">
    <canvas id="cC"></canvas>
    <div class="zc">
      <button class="btn" onclick="zI()">+</button>
      <div class="zl" id="zL">100%</div>
      <button class="btn" onclick="zO()">&#x2212;</button>
    </div>
  </div>

  <div class="dp" id="dP">
    <div class="dh">
      <h3 id="dT">&#x1F4A5; 详情</h3>
      <button class="dcl" onclick="closeD()">&#xD7;</button>
    </div>
    <img class="di" id="dI" src="" onclick="opLB()"/>
    <div class="db">
      <div class="dr"><div class="dl2">Prompt</div><div class="dv" id="dPP"></div></div>
      <div class="dr"><div class="dl2">类型</div><div class="dv" id="dTP"></div></div>
      <div class="dr"><div class="dl2">状态</div><div class="dv" id="dST"></div></div>
      <div class="dr"><div class="dl2">时间</div><div class="dv" id="dTM"></div></div>
      <div class="dr" id="dPR" style="display:none"><div class="dl2">来源</div><div class="dv" id="dPN"></div></div>
      <div class="dr" id="dCH" style="display:none"><div class="dl2">生成</div><div class="dv" id="dCN"></div></div>
    </div>
    <div class="da">
      <button onclick="dwD()">&#x2B07; 下载</button>
      <button onclick="copyUrl()">&#x1F4CB; 复制</button>
      <button onclick="opLB()">&#x1F50D; 放大</button>
    </div>
  </div>
</div>

<div class="lb" id="lB" onclick="clLB()">
  <button class="lbc" onclick="clLB()">&#xD7;</button>
  <img id="lI" src=""/>
</div>

<div class="ta2" id="tA2"></div>

<script>
// ===== Config =====
const B = 'http://localhost:8791';
const NW = 192, NH = 276;
const HDR = 30, PR_H = 42, FTR = 26;
const IMG_SZ = NW - 2;
const R = 10;

// ===== State =====
let PR = [], CP = null;
let ND = [], ED = [];
let VT = { s: 1, tx: 40, ty: 40 };
let isPn = false, pnX = 0, pnY = 0;
let drN = null, drSX = 0, drSY = 0;
let polls = {};
let sN = null, dN = null;
let imgCache = {};

// ===== Canvas =====
const cvs = document.getElementById('cC');
const ctx = cvs.getContext('2d');

function resizeC() {
  const w = document.getElementById('cW');
  cvs.width = w.clientWidth;
  cvs.height = w.clientHeight;
  rendC();
}
window.addEventListener('resize', resizeC);

function s2c(sx, sy) {
  const r = cvs.getBoundingClientRect();
  return { x: (sx - r.left - VT.tx) / VT.s, y: (sy - r.top - VT.ty) / VT.s };
}

function nodeAt(x, y) {
  for (let i = ND.length - 1; i >= 0; i--) {
    const n = ND[i];
    if (x >= n.x && x <= n.x + n.w && y >= n.y && y <= n.y + n.h) return n;
  }
  return null;
}

cvs.addEventListener('mousedown', e => {
  const { x, y } = s2c(e.clientX, e.clientY);
  const n = nodeAt(x, y);
  if (n) { drN = n; drSX = x - n.x; drSY = y - n.y; sN = n.id; }
  else { isPn = true; pnX = e.clientX; pnY = e.clientY; sN = null; }
  rendC();
});
cvs.addEventListener('mousemove', e => {
  if (drN) {
    const { x, y } = s2c(e.clientX, e.clientY);
    drN.x = Math.max(0, x - drSX);
    drN.y = Math.max(0, y - drSY);
    rendC();
  } else if (isPn) {
    VT.tx += e.clientX - pnX; VT.ty += e.clientY - pnY;
    pnX = e.clientX; pnY = e.clientY;
    rendC();
  } else {
    cvs.style.cursor = nodeAt(...Object.values(s2c(e.clientX, e.clientY))) ? 'pointer' : 'grab';
  }
});
cvs.addEventListener('mouseup', () => { isPn = false; drN = null; });
cvs.addEventListener('click', e => {
  const n = nodeAt(...Object.values(s2c(e.clientX, e.clientY)));
  if (n) opD(n.id);
});
cvs.addEventListener('dblclick', e => {
  const n = nodeAt(...Object.values(s2c(e.clientX, e.clientY)));
  if (n && n.thumb) opLB_src(n.thumb);
});
cvs.addEventListener('wheel', e => {
  e.preventDefault();
  const d = e.deltaY > 0 ? 0.88 : 1.13;
  const ns = Math.max(0.1, Math.min(5, VT.s * d));
  const r = cvs.getBoundingClientRect();
  const mx = e.clientX - r.left, my = e.clientY - r.top;
  VT.tx = mx - (mx - VT.tx) * (ns / VT.s);
  VT.ty = my - (my - VT.ty) * (ns / VT.s);
  VT.s = ns;
  document.getElementById('zL').textContent = Math.round(VT.s * 100) + '%';
  rendC();
}, { passive: false });

// ===== Projects =====
(async () => {
  await loadP();
  const pid = new URLSearchParams(location.search).get('projectId');
  if (pid) { CP = pid; await loadP2(pid); }
  else if (PR.length) { CP = PR[0].id; await loadP2(PR[0].id); }
  setTimeout(resizeC, 100); // delay to ensure flexbox dimensions are computed
  setInterval(() => { if (CP) loadP2(CP); }, 12000);
})();

async function loadP() {
  try { const r = await fetch(`${B}/api/projects`); const { data } = await r.json(); PR = data || []; rendP(); } catch {}
}
function rendP() {
  document.getElementById('pills').innerHTML = PR.map(p => {
    const s = p.sessions || [];
    const dc = s.some(x => x.status === 'generating') ? 'dy' : s.some(x => x.status === 'error') ? 'dr' : s.every(x => x.status === 'completed') ? 'dg' : 'dgy';
    return `<div class="pill ${p.id === CP ? 'on' : ''}" onclick="selP('${p.id}')"><span class="dot ${dc}"></span>${HT((p.name || p.id).slice(0, 12))}</div>`;
  }).join('');
}
async function selP(id) { CP = id; history.replaceState({}, '', `?projectId=${id}`); await loadP2(id); rendP(); }
async function loadP2(id) {
  try {
    const r = await fetch(`${B}/api/project/${id}`);
    if (!r.ok) return;
    const { data } = await r.json();
    build(data); rendL(); rendC(); rendP();
    document.getElementById('nCnt').textContent = ND.length;
  } catch {}
}
async function newP() {
  try {
    const r = await fetch(`${B}/api/session/change-project`, { method: 'POST' });
    const { data } = await r.json();
    await loadP(); await selP(data.projectUuid); showT('新项目已创建');
  } catch { showT('创建失败', 'er'); }
}
async function rld() { if (CP) await loadP2(CP); }

// ===== Build =====
function build(proj) {
  Object.values(polls).forEach(t => clearInterval(t));
  polls = {};
  const old = [...ND];
  ND = []; ED = [];
  const ss = proj.sessions || [];
  ss.forEach((s, i) => {
    const urls = gU(s.messages || [], s.resultUrls || []);
    const vid = (s.messages || []).some(m => m.content && /视频|动画|video/i.test(m.content));
    const pr = s.messages?.[0]?.content || '';
    const o = old.find(n => n.id === s.id) || {};
    const n = {
      id: s.id, type: vid ? 'video' : 'image', status: s.status,
      prompt: pr, url: urls[0] || '', thumb: urls[0] || '',
      createdAt: s.createdAt,
      x: o.x || 60 + (i % 4) * (NW + 40),
      y: o.y || 60 + Math.floor(i / 4) * (NH + 40),
      w: NW, h: NH, parentId: s.parentId || null,
    };
    // Explicit parentId from session data (for image→image story flow)
    if (n.parentId) {
      ED.push({ from: n.parentId, to: s.id });
    }
    ND.push(n);
    if (n.thumb && !imgCache[n.thumb]) preloadImg(n.thumb);
    if (s.status === 'generating') stP(s.id);
  });
}

function stP(id) {
  if (polls[id]) return;
  polls[id] = setInterval(async () => {
    try {
      const r = await fetch(`${B}/api/session/${id}`);
      const { data: s } = await r.json();
      const n = ND.find(x => n.id === id);
      if (!n) { clearInterval(polls[id]); return; }
      const urls = gU(s.messages || [], s.resultUrls || []);
      n.status = s.status;
      if (urls[0] && !n.thumb) { n.url = urls[0]; n.thumb = urls[0]; preloadImg(n.thumb); }
      rendL(); rendC();
      if (s.status === 'completed' || s.status === 'error') {
        clearInterval(polls[id]);
        if (s.status === 'completed') showT('\uD83C\uDF89 生成完成！');
      }
    } catch {}
  }, 6000);
}

function preloadImg(src) {
  if (!src || imgCache[src]) return;
  const img = new Image();
  img.onload = () => { imgCache[src] = img; rendC(); };
  img.src = src;
}

// ===== Render =====
function rendC() {
  const W = cvs.width, H = cvs.height;
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = "#0a0a0f";
  ctx.fillRect(0, 0, W / VT.s, H / VT.s);
  // DEBUG: red rectangle
  ctx.fillStyle = "#ff0000";
  ctx.fillRect(10, 10, 100, 50);
  ctx.save();
  ctx.translate(VT.tx, VT.ty);
  ctx.scale(VT.s, VT.s);
  drawGrid(W, H);
  ED.forEach(e => {
    const f = ND.find(n => n.id === e.from), t = ND.find(n => n.id === e.to);
    if (f && t) drawEdge(f, t, dN === f.id || dN === t.id);
  });
  ND.forEach(n => drawNode(n, n.id === sN, n.id === dN));
  ctx.restore();
}

function drawGrid(W, H) {
  const gs = 26;
  const ox = (VT.tx % (gs * VT.s)) / VT.s;
  const oy = (VT.ty % (gs * VT.s)) / VT.s;
  ctx.fillStyle = '#3d3d6a';
  for (let x = ox - gs; x < W / VT.s + gs; x += gs) {
    for (let y = oy - gs; y < H / VT.s + gs; y += gs) {
      ctx.beginPath();
      ctx.arc(x, y, 0.9, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

function drawEdge(from, to, hi) {
  const x1 = from.x + from.w / 2, y1 = from.y + from.h;
  const x2 = to.x + to.w / 2, y2 = to.y;
  const my = (y1 + y2) / 2;
  ctx.beginPath();
  ctx.strokeStyle = hi ? '#7c3aed' : '#35355a';
  ctx.lineWidth = hi ? 2 : 1.5;
  ctx.setLineDash(hi ? [] : [5, 4]);
  ctx.moveTo(x1, y1);
  ctx.bezierCurveTo(x1, my, x2, my, x2, y2);
  ctx.stroke();
  ctx.setLineDash([]);
  const ang = Math.atan2(y2 - my, 0);
  ctx.fillStyle = hi ? '#7c3aed' : '#35355a';
  ctx.save();
  ctx.translate(x2, y2);
  ctx.rotate(Math.PI);
  ctx.beginPath();
  ctx.moveTo(0, 0); ctx.lineTo(-7, -4); ctx.lineTo(-7, 4);
  ctx.closePath(); ctx.fill();
  ctx.restore();
  if (hi) {
    ctx.fillStyle = '#7c3aed';
    ctx.font = 'bold 9px system-ui';
    ctx.textAlign = 'center';
    ctx.fillText('\u2192 \u89C2\u5BDF', (x1 + x2) / 2, my - 5);
    ctx.textAlign = 'left';
  }
}

function drawNode(n, sel, det) {
  const { x, y, w, h } = n;
  const bc = sel || det ? '#06b6d4' : '#252538';
  ctx.shadowColor = sel || det ? 'rgba(124,58,237,0.4)' : 'rgba(124,58,237,0.15)';
  ctx.shadowBlur = sel || det ? 20 : 12;
  rRect(x, y, w, h, R);
  ctx.fillStyle = '#1e1e38';
  ctx.fill();
  ctx.shadowBlur = 0;
  rRect(x, y, w, h, R);
  ctx.strokeStyle = '#6366f1'; ctx.lineWidth = 2; ctx.stroke();
  // Header bg
  ctx.fillStyle = 'rgba(255,255,255,0.08)';
  rRectT(x, y, w, HDR, R);
  ctx.fill();
  // Header text
  ctx.fillStyle = '#a78bfa';
  ctx.font = 'bold 10px system-ui';
  ctx.fillText(n.type === 'video' ? '\uD83D\uDCF9 \u89C2\u5BDF' : '\uD83D\uDDBD \u56FE\u7247', x + 8, y + 19);
  // Status dot
  ctx.beginPath();
  ctx.arc(x + w - 12, y + 15, 4, 0, Math.PI * 2);
  ctx.fillStyle = sC(n.status); ctx.fill();
  if (n.status === 'generating') {
    ctx.beginPath(); ctx.arc(x + w - 12, y + 15, 4, 0, Math.PI * 2);
    ctx.strokeStyle = '#84cc16'; ctx.lineWidth = 1.5; ctx.stroke();
  }
  // Separator
  ctx.beginPath(); ctx.moveTo(x, y + HDR); ctx.lineTo(x + w, y + HDR);
  ctx.strokeStyle = '#3a3a5a'; ctx.lineWidth = 1; ctx.stroke();
  // Image
  const iy = y + HDR;
  if (n.thumb && imgCache[n.thumb]) {
    ctx.save();
    rRect(x + 1, iy + 1, w - 2, IMG_SZ - 2, R - 1);
    ctx.clip();
    ctx.drawImage(imgCache[n.thumb], x + 1, iy + 1, w - 2, IMG_SZ - 2);
    ctx.restore();
  } else {
    ctx.fillStyle = '#2a2a48';
    rRect(x + 1, iy + 1, w - 2, IMG_SZ - 2, R - 1);
    ctx.fill();
    ctx.strokeStyle = '#4040aa';
    ctx.lineWidth = 1;
    ctx.strokeRect(x + 1, iy + 1, w - 2, IMG_SZ - 2);
    ctx.fillStyle = '#ffd700';
    ctx.font = '32px system-ui';
    ctx.textAlign = 'center';
    ctx.fillText(n.type === 'video' ? '\uD83D\uDCF9' : '\uD83D\uDDBD', x + w / 2, iy + IMG_SZ / 2 + 11);
    ctx.textAlign = 'left';
  }
  // Progress bar animation
  if (n.status === 'generating') {
    const t = (Date.now() / 1500) % 1;
    ctx.fillStyle = '#7c3aed';
    ctx.fillRect(x + 1, iy + IMG_SZ - 3, (w - 2) * t, 3);
    ctx.fillStyle = '#06b6d4';
    ctx.fillRect(x + 1, iy + IMG_SZ - 3, (w - 2) * 0.35, 3);
  }
  // Separator
  ctx.beginPath(); ctx.moveTo(x, y + HDR + IMG_SZ); ctx.lineTo(x + w, y + HDR + IMG_SZ);
  ctx.strokeStyle = '#3a3a5a'; ctx.lineWidth = 1; ctx.stroke();
  // Prompt
  ctx.fillStyle = '#94a3b8';
  ctx.font = '9px system-ui';
  const pr = (n.prompt || '\u65E0\u63CF\u8FF0').slice(0, 38);
  ctx.save();
  ctx.beginPath(); ctx.rect(x + 6, y + HDR + IMG_SZ + 4, w - 12, 32); ctx.clip();
  ctx.fillText(pr, x + 6, y + HDR + IMG_SZ + 15);
  ctx.restore();
  // Footer
  const fy = y + HDR + IMG_SZ + PR_H;
  ctx.beginPath(); ctx.moveTo(x, fy); ctx.lineTo(x + w, fy);
  ctx.strokeStyle = '#3a3a5a'; ctx.lineWidth = 1; ctx.stroke();
  ctx.fillStyle = '#94a3b8';
  ctx.font = '8px system-ui';
  ctx.fillText(fmtD(n.createdAt), x + 7, fy + 14);
  if (n.parentId) {
    ctx.fillStyle = '#7c3aed';
    ctx.font = 'bold 8px system-ui';
    const lb = '\u2192 \u7236\u8282\u70B9';
    ctx.fillText(lb, x + w - ctx.measureText(lb).width - 7, fy + 14);
  }
}

function rRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}
function rRectT(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h);
  ctx.lineTo(x, y + h);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

// ===== Node list =====
function rendL() {
  document.getElementById('nL').innerHTML = ND.map(n => `
    <div class="ni ${sN === n.id ? 'on' : ''}" onclick="focN('${n.id}')">
      ${n.thumb ? `<img class="nth" src="${n.thumb}"/>` : `<div class="nth"></div>`}
      <div class="nb2">
        <span class="nt2">${n.type === 'video' ? '\uD83D\uDCF9' : '\uD83D\uDDBD'} ${HT((n.prompt || '').slice(0, 16))}</span>
        <div class="nm2"><span class="ndot" style="background:${sC(n.status)}"></span>${fmtD(n.createdAt)}</div>
      </div>
    </div>
  `).join('');
}

function focN(id) {
  const n = ND.find(x => x.id === id);
  if (!n) return;
  VT.tx = cvs.width / 2 - (n.x + n.w / 2) * VT.s;
  VT.ty = cvs.height / 2 - (n.y + n.h / 2) * VT.s;
  opD(id);
  rendC();
}

// ===== Detail =====
function opD(id) {
  const n = ND.find(x => x.id === id);
  if (!n) return;
  dN = id; sN = id;
  document.getElementById('dT').textContent = `${n.type === 'video' ? '\uD83D\uDCF9' : '\uD83D\uDDBD'} ${n.status === 'generating' ? '\u751F\u6210\u4E2D' : n.status === 'completed' ? '\u5DF2\u5B8C\u6210' : n.status === 'error' ? '\u5931\u8D25' : ''}`;
  document.getElementById('dI').src = n.thumb || '';
  document.getElementById('dPP').textContent = n.prompt || '\u65E0';
  document.getElementById('dTP').textContent = n.type === 'video' ? '\uD83D\uDCF9 \u89C2\u5BDF' : '\uD83D\uDDBD \u56FE\u7247';
  document.getElementById('dST').textContent = n.status;
  document.getElementById('dTM').textContent = fmtD(n.createdAt);
  const par = n.parentId ? ND.find(x => x.id === n.parentId) : null;
  if (par) {
    document.getElementById('dPR').style.display = 'block';
    document.getElementById('dPN').innerHTML = `<span style="color:var(--ac);cursor:pointer" onclick="focN('${par.id}')">${par.type === 'video' ? '\uD83D\uDCF9' : '\uD83D\uDDBD'}</span> ${HT((par.prompt || '').slice(0, 30))}`;
  } else {
    document.getElementById('dPR').style.display = 'none';
  }
  const ch = ND.filter(x => x.parentId === n.id);
  if (ch.length) {
    document.getElementById('dCH').style.display = 'block';
    document.getElementById('dCN').innerHTML = ch.map(c => `<div style="margin-bottom:4px"><span style="color:var(--ac);cursor:pointer" onclick="focN('${c.id}')">${c.type === 'video' ? '\uD83D\uDCF9' : '\uD83D\uDDBD'}</span> ${HT((c.prompt || '').slice(0, 24))}</div>`).join('');
  } else {
    document.getElementById('dCH').style.display = 'none';
  }
  document.getElementById('dP').classList.add('on');
  rendL(); rendC();
}

function closeD() { dN = null; document.getElementById('dP').classList.remove('on');
function dwD() {
  const n = dN ? ND.find(x => x.id === dN) : null;
  if (!n || !n.thumb) return;
  const a = document.createElement('a');
  a.href = n.thumb; a.download = ''; a.target = '_blank'; a.click();
}
function opLB() {
  const n = dN ? ND.find(x => x.id === dN) : null;
  if (!n || !n.thumb) return;
  document.getElementById('lI').src = n.thumb;
  document.getElementById('lB').classList.add('on');
}
function opLB_src(src) {
  document.getElementById('lI').src = src;
  document.getElementById('lB').classList.add('on');
}
function clLB() { document.getElementById('lB').classList.remove('on'); }
function copyUrl() {
  const n = dN ? ND.find(x => x.id === dN) : null;
  if (!n || !n.thumb) return;
  navigator.clipboard.writeText(n.thumb).then(() => showT('链接已复制')).catch(() => showT('复制失败', 'err'));
}
function zI() { VT.s = Math.min(5, VT.s * 1.2); document.getElementById('zL').textContent = Math.round(VT.s * 100) + '%'; rendC(); }
function zO() { VT.s = Math.max(0.1, VT.s * 0.8); document.getElementById('zL').textContent = Math.round(VT.s * 100) + '%'; rendC(); }

// ===== Utils =====
function gU(msgs, extraUrls) {
  if (!msgs) msgs = [];
  const out = [], pat = /https?:\/\/[^\s"'<>]+\.(?:png|jpg|jpeg|webp|gif|mp4|mov|webm)(\?[^"'<>]*)?/gi;
  msgs.forEach(m => {
    if (m.content) { let x; while ((x = pat.exec(m.content)) !== null) out.push(x[0]); }
    if (Array.isArray(m.resultUrls)) m.resultUrls.forEach(u => { if (!out.includes(u)) out.push(u); });
  });
  if (Array.isArray(extraUrls)) extraUrls.forEach(u => { if (!out.includes(u)) out.push(u); });
  return [...new Set(out)];
}
function HT(s) { if (!s) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function sC(s) { return s === 'completed' ? '#22c55e' : s === 'generating' ? '#84cc16' : s === 'error' ? '#ef4444' : '#64748b'; }
function fmtD(iso) { if (!iso) return '—'; return new Date(iso).toLocaleString('zh-CN',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}); }
function showT(msg, cls='ok') { const t = document.getElementById('tA2'); t.textContent = msg; t.className = `ta2 on ${cls}`; setTimeout(() => t.className = 'ta2', 3000); }

</script>
