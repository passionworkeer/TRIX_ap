<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TRIX Companion - Float</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        background: transparent;
        overflow: hidden;
        -webkit-app-region: drag;
        user-select: none;
      }
      #root {
        width: 100vw;
        height: 100vh;
        background: transparent;
      }
      /* Buttons and all interactive elements must NOT be draggable */
      button, a, input, select, textarea, [role="button"] {
        -webkit-app-region: no-drag;
      }
      /* QR panel has onClick but is not a form element */
      .qr-panel {
        -webkit-app-region: no-drag;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./float.tsx"></script>
  </body>
</html>
