appId: com.trixapp.companion
productName: TRIX Companion
copyright: Copyright © 2026 TRIX Team
directories:
  output: C:/Users/wang/Desktop/TRIX Companion
  buildResources: build
asar: true
compression: maximum
files:
  - package.json
  - dist-desktop/main/**/*
  - dist-desktop/preload/**/*
  - dist-desktop/renderer/assets/**/*
  - dist-desktop/renderer/*.html
  - dist-desktop/renderer/desktop/src/renderer/*.html
  - '!**/3d/**'
  - '!**/companion-check.html'
  - '!**/env-check.html'
  - '!**/pairing.html'
  - '!**/manifest.json'
  - '!**/sw.js'
  - '!**/videos/**'
  - '!**/dist/**'
  - '!**/node_modules/**'
extraResources:
  - from: ../public/videos
    to: videos
    filter:
      - '**/*'
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: msi
      arch:
        - x64
  icon: build/icon.ico
  artifactName: ${productName}-Setup-${version}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: TRIX Companion
  include: build/installer.nsh
  language: 2052
  installerSidebar: build/sidebar.bmp
  uninstallerSidebar: build/sidebar.bmp
  installerHeaderIcon: build/icon.ico
  license: build/eula.txt
  uninstallerIcon: build/icon.ico
  runAfterFinish: true
msi:
  oneClick: false
electronDist: ../node_modules/electron/dist
electronVersion: 33.4.0
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
publish: null
