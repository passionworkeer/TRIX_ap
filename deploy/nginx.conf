# Nginx 配置文件 - TRIX 3D Companion
# 适用于 2GB 内存服务器的轻量级配置

server {
    listen 80;
    server_name your-domain.com;  # 修改为你的域名

    # 网站根目录
    root /var/www/trix-3d-companion;
    index index.html;

    # Gzip 压缩配置
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/x-javascript
        image/svg+xml;

    # 静态资源缓存配置
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # HTML 文件不缓存（支持热更新）
    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # WebSocket 代理（如果后端服务在同一服务器）
    location /gateway {
        proxy_pass http://127.0.0.1:18789;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
    }

    # React Router 的 SPA fallback 配置
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 安全头部
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # 日志配置（生产环境可以关闭以提升性能）
    access_log /var/log/nginx/trix-3d-companion-access.log;
    error_log /var/log/nginx/trix-3d-companion-error.log;

    # 客户端上传大小限制（用于文件上传）
    client_max_body_size 10M;
}
