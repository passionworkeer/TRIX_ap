name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        continue-on-error: true
        run: npm run type-check

      - name: Lint
        continue-on-error: true
        run: npm run lint

      - name: Run tests
        run: npm run test:run

      - name: Build
        run: npm run build
