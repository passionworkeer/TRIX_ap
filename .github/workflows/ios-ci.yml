name: iOS CI/CD

on:
  push:
    branches: [main, develop, 'feat/**']
  pull_request:
    branches: [main, develop]

env:
  DEVELOPER_DIR: /Applications/Xcode_15.0.app/Contents/Developer

jobs:
  build:
    name: Build and Test
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.0.app/Contents/Developer

      - name: Cache Swift packages
        uses: actions/cache@v3
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData
            .build
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Cache Xcode plugins
        uses: actions/cache@v3
        with:
          path: |
            ~/Library/Developer/Xcode/Archives
          key: ${{ runner.os }}-archives-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-archives-

      - name: Build
        run: |
          xcodebuild -project ios/TRIX3DCompanion/TRIX3DCompanion.xcodeproj \
            -scheme TRIX3DCompanion \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 15 Pro' \
            build

      - name: Run Tests
        run: |
          xcodebuild -project ios/TRIX3DCompanion/TRIX3DCompanion.xcodeproj \
            -scheme TRIX3DCompanion \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 15 Pro' \
            -enableCodeCoverage YES \
            test

  lint:
    name: SwiftLint
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run SwiftLint
        uses: norio-nomura/action-swiftlint@shiftmetric
        with:
          args: --config ios/.swiftlint.yml ios/

  security:
    name: Security Scan
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Swift Package Dependency Analysis
        run: |
          xcodebuild -project ios/TRIX3DCompanion/TRIX3DCompanion.xcodeproj \
            -scheme TRIX3DCompanion \
            -resolvePackageDependencies

      - name: Check for vulnerabilities
        run: |
          # Check for known vulnerabilities in dependencies
          if [ -f Package.resolved ]; then
            echo "Dependencies resolved successfully"
          fi

  code-coverage:
    name: Code Coverage
    runs-on: macos-14
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.0.app/Contents/Developer

      - name: Generate Coverage Report
        run: |
          xcodebuild -project ios/TRIX3DCompanion/TRIX3DCompanion.xcodeproj \
            -scheme TRIX3DCompanion \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 15 Pro' \
            -enableCodeCoverage YES \
            test \
            -resultBundlePath CoverageResult \
            -derivedDataPath DerivedData

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./CoverageResult/coverage.xcresult
          flags: ios
          name: TRIX3DCompanion

  archive:
    name: Build Archive
    runs-on: macos-14
    needs: [build, lint, security]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.0.app/Contents/Developer

      - name: Create Archive
        run: |
          xcodebuild -project ios/TRIX3DCompanion/TRIX3DCompanion.xcodeproj \
            -scheme TRIX3DCompanion \
            -configuration Release \
            -archivePath ./TRIX3DCompanion \
            archive

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v3
        with:
          name: TRIX3DCompanion-Archive
          path: TRIX3DCompanion.xcarchive
          retention-days: 7
