name: 自动部署到服务器

on:
  push:
    branches:
      - main  # 当推送到 main 分支时触发

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 检出代码
      - name: 检出代码
        uses: actions/checkout@v4

      # 2. 安装 Node.js
      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3. 安装依赖并构建
      - name: 安装依赖
        run: npm install

      - name: 构建项目
        run: |
          npm install terser --save-dev
          npm run build
        env:
          CI: true

      # 4. 打包构建产物
      - name: 打包构建产物
        run: |
          cd dist
          tar -czf ../trix-build.tar.gz .
          cd ..

      # 5. 部署到服务器
      - name: 部署到服务器
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script_stop: true
          script: |
            # 清理并创建临时目录
            rm -rf /tmp/trix-deploy
            mkdir -p /tmp/trix-deploy

            # 停止服务（维护模式）
            # systemctl stop nginx  # 可选：需要时启用

            # 部署新版本
            rm -rf /var/www/trix-3d-companion-web-backup
            cp -r /var/www/trix-3d-companion-web /var/www/trix-3d-companion-web-backup

            # 重启服务
            # systemctl start nginx  # 可选：需要时启用

      # 6. 上传构建产物
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: trix-build.tar.gz

      # 7. 使用 scp 上传到服务器
      - name: 复制文件到服务器
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: "trix-build.tar.gz"
          target: "/tmp/"

      # 8. 在服务器上解压并部署
      - name: 在服务器上部署
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script_stop: true
          script: |
            # 解压到临时目录
            mkdir -p /tmp/trix-deploy
            tar -xzf /tmp/trix-build.tar.gz -C /tmp/trix-deploy

            # 备份当前版本（如果部署失败可回滚）
            if [ -d "/var/www/trix-3d-companion-web" ]; then
              rm -rf /var/www/trix-3d-companion-web-backup
              cp -r /var/www/trix-3d-companion-web /var/www/trix-3d-companion-web-backup
            fi

            # 部署新版本
            rm -rf /var/www/trix-3d-companion-web/*
            cp -r /tmp/trix-deploy/* /var/www/trix-3d-companion-web/

            # 设置权限
            chown -R www-data:www-data /var/www/trix-3d-companion-web
            chmod -R 755 /var/www/trix-3d-companion-web

            # 清理临时文件
            rm -rf /tmp/trix-deploy
            rm /tmp/trix-build.tar.gz

            # 检查 Nginx 配置
            nginx -t

            # 重启 Nginx
            systemctl reload nginx

            echo "✓ 部署成功！"
            echo "网站地址: http://47.243.55.130"
            free -h | grep "Mem:"
