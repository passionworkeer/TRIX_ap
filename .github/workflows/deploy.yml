name: 自动部署到服务器

on:
  push:
    branches:
      - feature/nanobot-integration  # 推送到此分支时触发
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 检出代码
      - name: 检出代码
        uses: actions/checkout@v4

      # 2. 设置 Node.js
      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3. 安装依赖并构建
      - name: 安装依赖
        run: npm ci

      - name: 构建项目
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      # 4. 打包构建产物
      - name: 打包构建产物
        run: |
          cd dist
          tar -czf ../trix-build.tar.gz .

      # 5. 部署到服务器
      - name: 部署到服务器
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script_stop: true
          script: |
            echo "=== 开始部署到服务器 ==="

            # 备份当前版本
            if [ -d "/var/www/html" ] && [ "$(ls -A /var/www/html)" ]; then
              echo "备份当前版本..."
              rm -rf /var/www/html-backup
              cp -r /var/www/html /var/www/html-backup
              echo "✓ 备份完成"
            fi

            # 清空部署目录
            echo "清空部署目录..."
            rm -rf /var/www/html/*
            echo "✓ 目录已清空"

            # 解压新版本
            echo "部署新版本..."
            tar -xzf /tmp/trix-build.tar.gz -C /var/www/html/
            echo "✓ 文件已解压"

            # 设置权限
            echo "设置权限..."
            chown -R www-data:www-data /var/www/html/
            chmod -R 755 /var/www/html/
            echo "✓ 权限已设置"

            # 测试 Nginx 配置
            echo "测试 Nginx 配置..."
            nginx -t
            echo "✓ Nginx 配置正确"

            # 重启 Nginx
            echo "重启 Nginx..."
            systemctl reload nginx
            echo "✓ Nginx 已重启"

            echo "=== 部署完成！==="
            echo "网站地址: http://TRIX_SERVER_HOST"

      # 6. 上传构建产物到服务器
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: trix-build.tar.gz

      # 7. 使用 scp 上传到服务器
      - name: 复制文件到服务器
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: "trix-build.tar.gz"
          target: "/tmp/"

      # 8. 部署通知
      - name: 部署通知
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ 部署成功！"
            echo "📱 访问地址: http://TRIX_SERVER_HOST"
          else
            echo "❌ 部署失败！"
            echo "请检查 GitHub Actions 日志"
          fi
