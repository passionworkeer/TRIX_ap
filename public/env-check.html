<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRIX 环境变量检查</title>
    <style>
        body {
            font-family: monospace;
            background: #1a1a1a;
            color: #00ff00;
            padding: 20px;
            line-height: 1.6;
        }
        .env-item {
            background: #2a2a2a;
            padding: 15px;
            margin: 10px 0;
            border-left: 4px solid #00ff00;
        }
        .env-key {
            color: #ffaa00;
            font-weight: bold;
        }
        .env-value {
            color: #00ffff;
            font-size: 16px;
        }
        .warning {
            background: #ff6600;
            color: white;
            padding: 10px;
            margin: 10px 0;
        }
        .success {
            background: #00aa00;
            color: white;
            padding: 10px;
            margin: 10px 0;
        }
        button {
            background: #00aa00;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            cursor: pointer;
            margin: 10px 5px;
        }
        button:hover {
            background: #00ff00;
            color: black;
        }
        #testResult {
            margin-top: 20px;
            padding: 15px;
            background: #2a2a2a;
        }
    </style>
</head>
<body>
    <h1>🔧 TRIX 配置检查</h1>
    
    <div class="env-item">
        <div class="env-key">VITE_PC_WEBSOCKET_URL:</div>
        <div class="env-value" id="wsUrl">加载中...</div>
    </div>
    
    <div class="env-item">
        <div class="env-key">VITE_PC_AUTH_TOKEN:</div>
        <div class="env-value" id="authToken">加载中...</div>
    </div>
    
    <div class="env-item">
        <div class="env-key">当前访问 URL:</div>
        <div class="env-value" id="currentUrl"></div>
    </div>
    
    <div class="env-item">
        <div class="env-key">推荐 WebSocket URL:</div>
        <div class="env-value" id="recommendedWs"></div>
    </div>
    
    <div id="status"></div>
    
    <h2>测试 WebSocket 连接</h2>
    <button onclick="testConnection()">🔌 测试连接到 Gateway</button>
    <button onclick="location.reload()">🔄 刷新页面</button>
    
    <div id="testResult"></div>

    <script type="module">
        // 显示环境变量
        const wsUrl = import.meta.env.VITE_PC_WEBSOCKET_URL;
        const authToken = import.meta.env.VITE_PC_AUTH_TOKEN;
        
        document.getElementById('wsUrl').textContent = wsUrl || '❌ 未配置';
        document.getElementById('authToken').textContent = authToken ? '✅ 已配置 (***' + authToken.slice(-8) + ')' : '❌ 未配置';
        document.getElementById('currentUrl').textContent = window.location.href;
        
        // 推荐的 WebSocket URL
        const hostname = window.location.hostname;
        let recommendedWs;
        if (hostname === 'localhost' || hostname === '127.0.0.1') {
            recommendedWs = 'ws://localhost:18789';
        } else {
            recommendedWs = `ws://${hostname}:18789`;
        }
        document.getElementById('recommendedWs').textContent = recommendedWs;
        
        // 检查配置
        const statusDiv = document.getElementById('status');
        if (!wsUrl) {
            statusDiv.innerHTML = '<div class="warning">⚠️ 警告: VITE_PC_WEBSOCKET_URL 未配置!</div>';
        } else if (wsUrl.includes('localhost') && hostname !== 'localhost' && hostname !== '127.0.0.1') {
            statusDiv.innerHTML = `
                <div class="warning">
                    ⚠️ 配置错误!<br>
                    当前配置: ${wsUrl}<br>
                    当前访问: ${window.location.href}<br>
                    问题: 通过 ${hostname} 访问时,无法连接到 localhost!<br>
                    <br>
                    解决方案: 修改 .env 文件:<br>
                    VITE_PC_WEBSOCKET_URL=${recommendedWs}
                </div>
            `;
        } else if (wsUrl === recommendedWs) {
            statusDiv.innerHTML = '<div class="success">✅ 配置正确!</div>';
        } else {
            statusDiv.innerHTML = `<div class="warning">⚠️ 当前配置: ${wsUrl}<br>推荐配置: ${recommendedWs}</div>`;
        }
        
        // 测试连接函数
        window.testConnection = function() {
            const resultDiv = document.getElementById('testResult');
            resultDiv.innerHTML = '<div style="color: yellow;">🔄 正在连接...</div>';
            
            const testWs = wsUrl || recommendedWs;
            resultDiv.innerHTML += `<div>尝试连接: ${testWs}</div>`;
            
            const ws = new WebSocket(testWs);
            
            const timeout = setTimeout(() => {
                ws.close();
                resultDiv.innerHTML += '<div style="color: red;">❌ 连接超时 (5秒)</div>';
            }, 5000);
            
            ws.onopen = () => {
                clearTimeout(timeout);
                resultDiv.innerHTML += '<div style="color: lime;">✅ WebSocket 连接成功!</div>';
                resultDiv.innerHTML += '<div>发送认证...</div>';
                
                ws.send(JSON.stringify({
                    action: 'auth',
                    token: authToken
                }));
            };
            
            ws.onmessage = (event) => {
                resultDiv.innerHTML += `<div style="color: cyan;">📥 收到消息: ${event.data}</div>`;
                const data = JSON.parse(event.data);
                if (data.action === 'auth' && data.status === 'ok') {
                    resultDiv.innerHTML += '<div style="color: lime;">✅ 认证成功!</div>';
                    ws.close();
                }
            };
            
            ws.onerror = (error) => {
                clearTimeout(timeout);
                resultDiv.innerHTML += '<div style="color: red;">❌ WebSocket 错误</div>';
                console.error('WebSocket error:', error);
            };
            
            ws.onclose = (event) => {
                clearTimeout(timeout);
                resultDiv.innerHTML += `<div>🔌 连接关闭: Code ${event.code}</div>`;
            };
        };
    </script>
</body>
</html>
