<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TRIX Pairing</title>
    <script>
      (async () => {
        const canonicalHost = 'trix.love';
        const legacyHosts = new Set([
          'taxilab.app',
          'www.taxilab.app',
          'taxilab.com',
          'www.taxilab.com',
          'taxilab.ai',
          'www.taxilab.ai',
        ]);

        if (legacyHosts.has(window.location.hostname)) {
          const target = new URL(window.location.href);
          target.protocol = 'https:';
          target.host = canonicalHost;
          window.location.replace(target.toString());
          return;
        }

        try {
          if ('serviceWorker' in navigator) {
            const registrations = await navigator.serviceWorker.getRegistrations();
            await Promise.allSettled(registrations.map((registration) => registration.unregister()));
          }
          if ('caches' in window) {
            const cacheNames = await caches.keys();
            await Promise.allSettled(
              cacheNames.map((cacheName) => caches.delete(cacheName))
            );
          }
        } catch (error) {
          console.warn('[TRIX] Failed to retire legacy PWA shell', error);
        }
      })();

      window.addEventListener('message', (event) => {
        if (event?.data?.type === 'trix-sw-retired') {
          window.location.reload();
        }
      });
    </script>
    <style>
      :root {
        color-scheme: light;
        --bg: #f5efe5;
        --panel: rgba(255, 255, 255, 0.9);
        --text: #161616;
        --muted: #666158;
        --accent: #0b6e4f;
        --danger: #b42318;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Avenir Next", "PingFang SC", sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at top right, rgba(11, 110, 79, 0.14), transparent 35%),
          linear-gradient(160deg, #f8f2e8, #efe7dc);
        display: grid;
        place-items: center;
        padding: 24px;
      }
      .card {
        width: min(560px, 100%);
        padding: 28px;
        border-radius: 24px;
        background: var(--panel);
        box-shadow: 0 24px 80px rgba(17, 24, 39, 0.12);
        border: 1px solid rgba(17, 24, 39, 0.08);
      }
      h1 { margin: 0 0 12px; font-size: 2.2rem; }
      p { margin: 0 0 14px; color: var(--muted); line-height: 1.5; }
      label { display: block; margin: 18px 0 8px; font-weight: 700; }
      input {
        width: 100%;
        padding: 14px 16px;
        border-radius: 14px;
        border: 1px solid rgba(17, 24, 39, 0.14);
        font: inherit;
        background: rgba(255, 255, 255, 0.8);
      }
      button {
        width: 100%;
        margin-top: 18px;
        padding: 14px 18px;
        border: 0;
        border-radius: 14px;
        background: var(--accent);
        color: white;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      button:disabled { opacity: 0.6; cursor: wait; }
      .meta {
        margin-top: 18px;
        padding: 14px 16px;
        border-radius: 14px;
        background: rgba(17, 24, 39, 0.05);
        white-space: pre-wrap;
        word-break: break-word;
      }
      .error { color: var(--danger); }
      .success { color: var(--accent); }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>TRIX 配对</h1>
      <p>这个页面会直接向 Trix Service 提交 claim，并在当前浏览器生成稳定的设备 ID。</p>
      <div id="hint" class="meta">等待配对参数...</div>
      <label for="deviceName">设备名称</label>
      <input id="deviceName" type="text" />
      <button id="claimButton" type="button">完成配对</button>
      <div id="result" class="meta" hidden></div>
    </main>
    <script>
      const params = new URLSearchParams(window.location.search);
      const code = (params.get('code') || '').trim().toUpperCase();
      const secret = (params.get('secret') || '').trim();
      const accountId = (params.get('accountId') || '').trim() || 'default';
      const hint = document.getElementById('hint');
      const result = document.getElementById('result');
      const button = document.getElementById('claimButton');
      const deviceNameInput = document.getElementById('deviceName');
      const storageKey = 'trix_native_channel_client_id';
      const legacyStorageKey = 'trix_native_pair_device_id';
      const claimStorageKey = 'trix_native_last_claim';
      const sessionStateKey = 'trix_native_channel_sessions_v2';
      const activeAccountKey = 'trix_native_channel_active_account';
      const legacySessionKey = 'trix_native_channel_session';

      function getSupabaseAccessToken() {
        for (const key of Object.keys(window.localStorage)) {
          if (!/^sb-.*-auth-token$/.test(key)) continue;
          const rawValue = window.localStorage.getItem(key);
          if (!rawValue) continue;
          try {
            const parsed = JSON.parse(rawValue);
            if (typeof parsed?.access_token === 'string') return parsed.access_token;
            if (typeof parsed?.currentSession?.access_token === 'string') return parsed.currentSession.access_token;
            if (typeof parsed?.session?.access_token === 'string') return parsed.session.access_token;
            if (Array.isArray(parsed)) {
              const candidate = parsed.find((entry) => typeof entry?.access_token === 'string');
              if (candidate?.access_token) return candidate.access_token;
            }
          } catch (_) {}
        }
        return null;
      }

      function decodeSupabaseUserId(accessToken) {
        if (!accessToken) return undefined;
        const parts = accessToken.split('.');
        if (parts.length < 2) return undefined;
        try {
          const payload = JSON.parse(atob(parts[1].replace(/-/g, '+').replace(/_/g, '/')));
          return typeof payload?.sub === 'string' && payload.sub.trim() ? payload.sub.trim() : undefined;
        } catch (_) {
          return undefined;
        }
      }

      function getClientId() {
        const existing = window.localStorage.getItem(storageKey);
        if (existing) return existing;
        const legacy = window.localStorage.getItem(legacyStorageKey);
        if (legacy) {
          window.localStorage.setItem(storageKey, legacy);
          return legacy;
        }
        const generated = `device:web-${(window.crypto && crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(16).slice(2))}`;
        window.localStorage.setItem(storageKey, generated);
        window.localStorage.setItem(legacyStorageKey, generated);
        return generated;
      }

      function setMessage(text, className) {
        result.hidden = false;
        result.className = `meta ${className || ''}`.trim();
        result.textContent = text;
      }

      if (!code) {
        hint.textContent = '缺少配对码。请重新从 OpenClaw 登录页面打开这个链接。';
        hint.classList.add('error');
        button.disabled = true;
      } else {
        hint.textContent = `配对码：${code}\n账号：${accountId}`;
      }

      deviceNameInput.value = `${navigator.platform || 'Web'} / ${navigator.userAgent.split(')')[0] || 'Browser'}`.slice(0, 120);

      button.addEventListener('click', async () => {
        if (!code) return;
        button.disabled = true;
        setMessage('正在提交 claim，请稍候...', '');
        try {
          const requestBody = {
            accountId,
            secret: secret || undefined,
            clientId: getClientId(),
            deviceName: deviceNameInput.value.trim() || 'Web Browser',
          };

          const runClaim = async (body) => {
            const accessToken = getSupabaseAccessToken();
            const response = await fetch(`/api/pairings/${encodeURIComponent(code)}/claim`, {
              method: 'POST',
              headers: {
                'content-type': 'application/json',
                ...(accessToken ? { authorization: `Bearer ${accessToken}` } : {}),
              },
              body: JSON.stringify(body),
            });
            const payload = await response.json().catch(() => ({}));
            return { response, payload, accessToken };
          };

          let { response, payload, accessToken } = await runClaim(requestBody);
          if (!response.ok && requestBody.secret && /invalid pairing secret/i.test(payload.error || '')) {
            ({ response, payload, accessToken } = await runClaim({
              ...requestBody,
              secret: undefined,
            }));
          }

          if (!response.ok) {
            throw new Error(payload.error || `Claim failed: ${response.status}`);
          }
          const resolvedAccountId = (payload.accountId || accountId || 'default').trim() || 'default';
          const websocketUrl = payload.websocketUrl || payload.wsUrl || `${String(payload.serverUrl || window.location.origin).replace(/^http/i, 'ws').replace(/\/$/, '')}/ws`;
          const appUserId = decodeSupabaseUserId(accessToken);
          const storedSession = {
            accountId: resolvedAccountId,
            appUserId,
            serverUrl: payload.serverUrl || window.location.origin,
            websocketUrl,
            conversationId: payload.conversationId,
            clientToken: payload.clientToken,
            clientId: getClientId(),
            deviceName: deviceNameInput.value.trim() || 'Web Browser',
            pairingCode: payload.pairing?.code || code,
          };
          let existingSessions = {};
          try {
            existingSessions = JSON.parse(window.localStorage.getItem(sessionStateKey) || '{}').sessions || {};
          } catch (_) {}
          const sessionState = {
            version: 2,
            activeAccountId: resolvedAccountId,
            sessions: {
              ...existingSessions,
              [resolvedAccountId]: storedSession,
            },
          };

          if (accessToken) {
            await fetch('/api/client/session/bind', {
              method: 'POST',
              headers: {
                'content-type': 'application/json',
                authorization: `Bearer ${accessToken}`,
              },
              body: JSON.stringify({
                conversationId: payload.conversationId,
                clientToken: payload.clientToken,
              }),
            }).catch(() => null);
          }

          window.localStorage.setItem(sessionStateKey, JSON.stringify(sessionState));
          window.localStorage.setItem(activeAccountKey, resolvedAccountId);
          window.localStorage.setItem(legacySessionKey, JSON.stringify(storedSession));
          window.localStorage.setItem(claimStorageKey, JSON.stringify(payload));
          setMessage(`配对成功。\naccountId: ${resolvedAccountId}\nconversationId: ${payload.conversationId}\npeerId: ${payload.peerId}\n现在可以回到 TRIX Web / iOS 继续。`, 'success');
          window.setTimeout(() => {
            window.location.href = '/#/chat/clawbot';
          }, 1200);
        } catch (error) {
          setMessage(error instanceof Error ? error.message : String(error), 'error');
        } finally {
          button.disabled = false;
        }
      });
    </script>
  </body>
</html>
