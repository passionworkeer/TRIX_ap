<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket 简单测试</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 800px;
            width: 100%;
            padding: 40px;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .info-box {
            background: #f5f5f5;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 30px;
        }
        .info-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #e0e0e0;
        }
        .info-item:last-child {
            border-bottom: none;
        }
        .info-label {
            font-weight: bold;
            color: #555;
        }
        .info-value {
            color: #667eea;
            font-family: monospace;
        }
        .test-section {
            margin-bottom: 30px;
        }
        .test-title {
            font-size: 18px;
            color: #333;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
        }
        .test-number {
            background: #667eea;
            color: white;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-right: 10px;
            font-weight: bold;
        }
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }
        button:active {
            transform: translateY(0);
        }
        .log {
            background: #1e1e1e;
            color: #d4d4d4;
            border-radius: 10px;
            padding: 20px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            max-height: 400px;
            overflow-y: auto;
            margin-top: 15px;
            line-height: 1.6;
        }
        .log-entry {
            margin: 5px 0;
            padding: 5px;
            border-left: 3px solid transparent;
            padding-left: 10px;
        }
        .log-success {
            color: #4caf50;
            border-left-color: #4caf50;
            background: rgba(76, 175, 80, 0.1);
        }
        .log-error {
            color: #f44336;
            border-left-color: #f44336;
            background: rgba(244, 67, 54, 0.1);
        }
        .log-info {
            color: #2196f3;
            border-left-color: #2196f3;
            background: rgba(33, 150, 243, 0.1);
        }
        .log-warning {
            color: #ff9800;
            border-left-color: #ff9800;
            background: rgba(255, 152, 0, 0.1);
        }
        .status {
            display: inline-block;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            margin-top: 15px;
        }
        .status-idle { background: #e0e0e0; color: #666; }
        .status-testing { background: #fff3cd; color: #856404; }
        .status-success { background: #d4edda; color: #155724; }
        .status-failed { background: #f8d7da; color: #721c24; }
        .emoji {
            font-size: 24px;
            margin-right: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 WebSocket 连接测试</h1>
        <p class="subtitle">诊断为什么 IP 地址访问时连接不上</p>

        <div class="info-box">
            <div class="info-item">
                <span class="info-label">当前访问地址:</span>
                <span class="info-value" id="current-url"></span>
            </div>
            <div class="info-item">
                <span class="info-label">主机名:</span>
                <span class="info-value" id="hostname"></span>
            </div>
            <div class="info-item">
                <span class="info-label">访问方式:</span>
                <span class="info-value" id="access-type"></span>
            </div>
            <div class="info-item">
                <span class="info-label">将要连接:</span>
                <span class="info-value" id="target-ws"></span>
            </div>
        </div>

        <div class="test-section">
            <div class="test-title">
                <span class="test-number">1</span>
                测试 localhost 连接
            </div>
            <button onclick="testLocalhost()">点击测试 localhost</button>
            <div class="status status-idle" id="localhost-status">等待测试</div>
            <div class="log" id="localhost-log" style="display:none;"></div>
        </div>

        <div class="test-section">
            <div class="test-title">
                <span class="test-number">2</span>
                测试局域网 IP 连接
            </div>
            <button onclick="testIP()">点击测试 192.168.101.4</button>
            <div class="status status-idle" id="ip-status">等待测试</div>
            <div class="log" id="ip-log" style="display:none;"></div>
        </div>

        <div class="test-section">
            <div class="test-title">
                <span class="test-number">3</span>
                智能测试(React 应用的逻辑)
            </div>
            <button onclick="testSmart()">点击智能测试</button>
            <div class="status status-idle" id="smart-status">等待测试</div>
            <div class="log" id="smart-log" style="display:none;"></div>
        </div>
    </div>

    <script>
        const AUTH_TOKEN = 'REDACTED_CLAWBOT_GATEWAY_TOKEN';
        
        // 显示页面信息
        document.getElementById('current-url').textContent = window.location.href;
        document.getElementById('hostname').textContent = window.location.hostname;
        
        const isLocalhost = window.location.hostname === 'localhost' || 
                           window.location.hostname === '127.0.0.1';
        
        document.getElementById('access-type').textContent = isLocalhost ? '💻 电脑本地访问' : '📱 局域网访问';
        
        const smartUrl = isLocalhost ? 'ws://localhost:18789' : `ws://${window.location.hostname}:18789`;
        document.getElementById('target-ws').textContent = smartUrl;

        function log(logId, message, type = 'info') {
            const logDiv = document.getElementById(logId);
            logDiv.style.display = 'block';
            const entry = document.createElement('div');
            entry.className = `log-entry log-${type}`;
            const time = new Date().toLocaleTimeString();
            entry.textContent = `[${time}] ${message}`;
            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function setStatus(statusId, text, type = 'idle') {
            const statusEl = document.getElementById(statusId);
            statusEl.textContent = text;
            statusEl.className = `status status-${type}`;
        }

        function clearLog(logId) {
            document.getElementById(logId).innerHTML = '';
        }

        function testWebSocket(logId, statusId, url, label) {
            clearLog(logId);
            setStatus(statusId, '测试中...', 'testing');
            
            log(logId, `🔌 开始测试: ${label}`, 'info');
            log(logId, `目标地址: ${url}`, 'info');
            
            try {
                const ws = new WebSocket(url);
                const startTime = Date.now();
                
                const timeout = setTimeout(() => {
                    if (ws.readyState !== WebSocket.OPEN) {
                        log(logId, '❌ 连接超时 (10秒)', 'error');
                        setStatus(statusId, '连接超时', 'failed');
                        ws.close();
                    }
                }, 10000);
                
                ws.onopen = () => {
                    clearTimeout(timeout);
                    const duration = Date.now() - startTime;
                    log(logId, `✅ 连接成功! (${duration}ms)`, 'success');
                    log(logId, `状态: ${ws.readyState} (OPEN)`, 'info');
                };
                
                ws.onmessage = (event) => {
                    try {
                        const data = JSON.parse(event.data);
                        
                        if (data.event === 'connect.challenge') {
                            log(logId, `📥 收到认证挑战`, 'info');
                            
                            const nonce = data.payload.nonce;
                            const response = {
                                type: 'req',
                                id: nonce,
                                method: 'connect',
                                params: {
                                    minProtocol: 3,
                                    maxProtocol: 3,
                                    role: 'operator',
                                    client: {
                                        id: 'clawdbot-ios',
                                        mode: 'webchat',
                                        platform: 'web',
                                        displayName: 'Browser Test',
                                        version: '1.0.0',
                                        instanceId: Math.random().toString(36).substring(2, 15)
                                    },
                                    caps: [],
                                    auth: { token: AUTH_TOKEN }
                                }
                            };
                            
                            log(logId, `📤 发送认证请求`, 'info');
                            ws.send(JSON.stringify(response));
                        }
                        
                        if (data.type === 'res' && data.payload?.type === 'hello-ok') {
                            log(logId, `🎉 认证成功!`, 'success');
                            log(logId, `协议版本: ${data.payload.protocol}`, 'info');
                            setStatus(statusId, '✅ 测试成功!', 'success');
                            
                            setTimeout(() => {
                                log(logId, `🔌 关闭连接`, 'info');
                                ws.close();
                            }, 1000);
                        }
                        
                        if (data.type === 'res' && data.error) {
                            log(logId, `❌ 认证失败: ${data.error.code}`, 'error');
                            log(logId, `原因: ${data.error.message}`, 'error');
                            setStatus(statusId, '认证失败', 'failed');
                        }
                    } catch (e) {
                        log(logId, `⚠️ 消息解析错误: ${e.message}`, 'warning');
                    }
                };
                
                ws.onerror = (error) => {
                    clearTimeout(timeout);
                    log(logId, `❌ WebSocket 错误发生`, 'error');
                    log(logId, `当前状态: ${ws.readyState}`, 'error');
                    setStatus(statusId, '❌ 连接失败', 'failed');
                    console.error('详细错误:', error);
                };
                
                ws.onclose = (event) => {
                    clearTimeout(timeout);
                    if (event.code !== 1000) {
                        log(logId, `🔌 连接关闭: code=${event.code}`, 'error');
                        log(logId, `原因: ${event.reason || '无'}`, 'error');
                        log(logId, `正常关闭: ${event.wasClean ? '是' : '否'}`, 'error');
                        
                        if (event.code === 1006) {
                            log(logId, '', 'error');
                            log(logId, '💡 错误 1006 通常表示:', 'warning');
                            log(logId, '   • 网络连接被阻断', 'warning');
                            log(logId, '   • 服务器拒绝连接', 'warning');
                            log(logId, '   • Windows Hairpin NAT 限制', 'warning');
                        }
                        
                        if (statusId.includes('status') && document.getElementById(statusId).textContent.includes('测试中')) {
                            setStatus(statusId, '❌ 连接失败', 'failed');
                        }
                    } else {
                        log(logId, `✅ 正常关闭`, 'success');
                    }
                };
                
            } catch (e) {
                log(logId, `❌ 创建连接失败: ${e.message}`, 'error');
                setStatus(statusId, '创建失败', 'failed');
                console.error('异常:', e);
            }
        }

        function testLocalhost() {
            testWebSocket('localhost-log', 'localhost-status', 'ws://localhost:18789', 'localhost');
        }

        function testIP() {
            testWebSocket('ip-log', 'ip-status', 'ws://192.168.101.4:18789', '192.168.101.4');
        }

        function testSmart() {
            const isLocalhost = window.location.hostname === 'localhost' || 
                               window.location.hostname === '127.0.0.1';
            
            const url = isLocalhost ? 'ws://localhost:18789' : `ws://${window.location.hostname}:18789`;
            const label = isLocalhost ? '智能选择: localhost' : '智能选择: ' + window.location.hostname;
            
            clearLog('smart-log');
            log('smart-log', `📍 检测到主机名: ${window.location.hostname}`, 'info');
            log('smart-log', `📍 选择策略: ${isLocalhost ? '本地访问' : '局域网访问'}`, 'info');
            log('smart-log', '', 'info');
            
            testWebSocket('smart-log', 'smart-status', url, label);
        }
    </script>
</body>
</html>
