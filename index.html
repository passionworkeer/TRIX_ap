<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>TRIX</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Noto Sans SC', sans-serif;
        background-color: #0f172a; /* Dark background for desktop view */
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }
      
      /* Mobile container styling */
      #root {
        width: 100%;
        max-width: 480px; /* Limit width for desktop viewing to simulate mobile */
        margin: 0 auto;
        min-height: 100vh;
        background-color: #ffffff;
        position: relative;
        overflow-x: hidden;
        box-shadow: 0 0 50px rgba(0,0,0,0.5);
      }

      /* Hide scrollbar for cleaner UI */
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      /* Custom Animations */
      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
      }
      .animate-float {
        animation: float 6s ease-in-out infinite;
      }
      
      @keyframes scan {
        0% { top: 5%; opacity: 0; }
        10% { opacity: 1; }
        90% { opacity: 1; }
        100% { top: 95%; opacity: 0; }
      }
      .animate-scan {
        animation: scan 3s linear infinite;
      }
    </style>
