    <!-- 濞夈劌鍞?Service Worker -->

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((registration) => {
              console.log('閴?SW registered:', registration.scope);
            })
            .catch((error) => {
              console.error('閴?SW registration failed:', error);
