<!doctype html>
<html lang="zh-CN" class="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon-192.png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <!-- PWA -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="TRIX" />
    <meta name="application-name" content="TRIX" />
    <meta name="theme-color" content="#0b6e4f" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b6e4f" media="(prefers-color-scheme: dark)" />
    <meta name="msapplication-TileColor" content="#0b6e4f" />

    <!-- SEO -->
    <meta name="description" content="TRIX AI companion for study, focus, chat, and pairing across devices." />
    <meta name="keywords" content="TRIX, OpenClaw, AI companion, study, focus, chat, pairing" />

    <!-- Baidu Maps JavaScript API GL - loaded dynamically via baiduMapService.ts -->

    <!-- 生产环境配置 -->
    <script>
      (async () => {
        const canonicalHost = 'trix.love';
        const legacyHosts = new Set([
          'taxilab.app',
          'www.taxilab.app',
          'taxilab.com',
          'www.taxilab.com',
          'taxilab.ai',
          'www.taxilab.ai',
        ]);

        if (legacyHosts.has(window.location.hostname)) {
          const target = new URL(window.location.href);
          target.protocol = 'https:';
          target.host = canonicalHost;
          window.location.replace(target.toString());
          return;
        }
      })();

      // 生产环境上传地址
      window.__PROD_UPLOAD_URL__ = window.location.origin;
    </script>

    <title>TRIX</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
