# SwiftLint Configuration for TRIX 3D Companion

# 规则配置
disabled_rules:
  - trailing_whitespace
  - force_cast
  - force_try
  - file_length
  - type_body_length
  - function_body_length

# 优化规则
opt_in_rules:
  - empty_count
  - closure_spacing
  - explicit_init
  - first_where
  - redundant_nil_coalescing
  - contains_over_first_not_nil
  - fallthrough
  - fatal_error_message
  - multiline_parameters
  - unneeded_parentheses_in_closure_argument
  - redundant_void_return
  - operator_usage_whitespace
  - closure_end_indentation

# 排除文件/目录
excluded:
  - .build
  - DerivedData
  - Packages
  - TRIX3DCompanion.xcodeproj
  - TRIX3DCompanion.xcworkspace
  - "**/*.xcodeproj"
  - "**/*.xcworkspace"
  - "**/DerivedData/**"
  - "**/.build/**"
  # 排除 C 代码绑定文件
  - "**/AppLaunchOptimizer.swift"

# 自定义规则配置
custom_rules:
  print_debug:
    name: "Debug Print"
    regex: "print\\("
    capture_named_group: 1
    message: "使用 SecureLogger 替代 print()"
    severity: warning

  sensitive_logging:
    name: "Sensitive Data Logging"
    regex: "(password|token|secret|key)\\s*="
    message: "确保日志不包含敏感信息"
    severity: warning

# 行长度限制
line_length:
  warning: 120
  error: 200
  ignores_comments: true
  ignores_urls: true

# 类型名称规则
type_name:
  min_length: 3
  max_length: 50

# 标识符名称规则
identifier_name:
  min_length: 1
  max_length: 60

# 报告类型
reporter: "xcode"
