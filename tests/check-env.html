<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRIX App 环境变量检查</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .content {
            padding: 30px;
        }

        .section {
            margin-bottom: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            border-left: 4px solid #667eea;
        }

        .section h2 {
            color: #333;
            margin-bottom: 15px;
            font-size: 20px;
        }

        .config-item {
            background: white;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            border: 1px solid #e0e0e0;
        }

        .config-label {
            font-weight: 600;
            color: #555;
            margin-bottom: 8px;
            display: block;
        }

        .config-value {
            font-family: 'Courier New', monospace;
            background: #f0f0f0;
            padding: 10px;
            border-radius: 5px;
            font-size: 14px;
            word-break: break-all;
        }

        .status-ok {
            color: #10b981;
            font-weight: 600;
        }

        .status-error {
            color: #ef4444;
            font-weight: 600;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            font-size: 14px;
            cursor: pointer;
            background: #667eea;
            color: white;
            font-weight: 600;
            margin-top: 10px;
        }

        .btn:hover {
            background: #5568d3;
        }

        .info-box {
            background: #e0f2fe;
            border: 1px solid #0284c7;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
        }

        .warning-box {
            background: #fef3c7;
            border: 1px solid #f59e0b;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
        }

        .code {
            font-family: 'Courier New', monospace;
            background: #f0f0f0;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔧 TRIX App 配置检查</h1>
            <p>检查环境变量和运行时配置</p>
        </div>

        <div class="content">
            <!-- 环境变量检查 -->
            <div class="section">
                <h2>📋 环境变量 (import.meta.env)</h2>
                <div class="config-item">
                    <span class="config-label">VITE_PC_WEBSOCKET_URL:</span>
                    <div class="config-value" id="env-ws-url">加载中...</div>
                </div>
                <div class="config-item">
                    <span class="config-label">VITE_PC_AUTH_TOKEN:</span>
                    <div class="config-value" id="env-auth-token">加载中...</div>
                </div>
                <div class="config-item">
                    <span class="config-label">VITE_SUPABASE_URL:</span>
                    <div class="config-value" id="env-supabase-url">加载中...</div>
                </div>
            </div>

            <!-- 当前位置检查 -->
            <div class="section">
                <h2>🌐 当前页面信息</h2>
                <div class="config-item">
                    <span class="config-label">页面 URL:</span>
                    <div class="config-value" id="page-url">-</div>
                </div>
                <div class="config-item">
                    <span class="config-label">协议:</span>
                    <div class="config-value" id="page-protocol">-</div>
                </div>
                <div class="config-item">
                    <span class="config-label">主机名:</span>
                    <div class="config-value" id="page-hostname">-</div>
                </div>
                <div class="config-item">
                    <span class="config-label">端口:</span>
                    <div class="config-value" id="page-port">-</div>
                </div>
            </div>

            <!-- 连接测试 -->
            <div class="section">
                <h2>🔌 连接测试</h2>
                <div id="test-results">
                    <button class="btn" onclick="testConnection()">开始测试连接</button>
                </div>
            </div>

            <!-- 建议 -->
            <div class="section">
                <h2>💡 诊断建议</h2>
                <div id="suggestions">
                    <p>请先点击上方按钮检查配置...</p>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        // 检查环境变量
        function checkEnvironment() {
            const wsUrl = import.meta.env.VITE_PC_WEBSOCKET_URL;
            const authToken = import.meta.env.VITE_PC_AUTH_TOKEN;
            const supabaseUrl = import.meta.env.VITE_SUPABASE_URL;

            document.getElementById('env-ws-url').textContent = wsUrl || '❌ 未定义';
            document.getElementById('env-auth-token').textContent = authToken || '❌ 未定义';
            document.getElementById('env-supabase-url').textContent = supabaseUrl || '❌ 未定义';

            // 页面信息
            document.getElementById('page-url').textContent = window.location.href;
            document.getElementById('page-protocol').textContent = window.location.protocol;
            document.getElementById('page-hostname').textContent = window.location.hostname;
            document.getElementById('page-port').textContent = window.location.port || '默认';

            return { wsUrl, authToken, supabaseUrl };
        }

        // 连接测试
        window.testConnection = async function() {
            const { wsUrl, authToken } = checkEnvironment();

            const resultsDiv = document.getElementById('test-results');
            resultsDiv.innerHTML = '<p>测试中...</p>';

            if (!wsUrl || !authToken) {
                resultsDiv.innerHTML = `
                    <div class="warning-box">
                        <strong>⚠️ 环境变量缺失</strong>
                        <p>请检查 .env 文件是否正确配置</p>
                        <p>并且确认已重启开发服务器 (npm run dev)</p>
                    </div>
                `;
                updateSuggestions('missing-env');
                return;
            }

            // 测试连接
            try {
                const ws = new WebSocket(wsUrl);
                let connected = false;
                let authenticated = false;

                ws.onopen = () => {
                    connected = true;
                    console.log('✅ WebSocket 连接成功');
                };

                ws.onmessage = (event) => {
                    const data = JSON.parse(event.data);
                    
                    if (data.event === 'connect.challenge') {
                        // 发送认证
                        const response = {
                            type: 'req',
                            id: data.payload?.nonce || data.id,
                            method: 'connect',
                            params: {
                                minProtocol: 3,
                                maxProtocol: 3,
                                role: 'operator',
                                client: {
                                    id: 'clawdbot-ios',
                                    mode: 'webchat',
                                    platform: 'ios',
                                    displayName: 'TRIX App',
                                    version: '1.0.0',
                                    instanceId: Math.random().toString(36).substring(7)
                                },
                                caps: [],
                                auth: { token: authToken }
                            }
                        };
                        ws.send(JSON.stringify(response));
                    }

                    if (data.type === 'res' && data.payload?.type === 'hello-ok') {
                        authenticated = true;
                        ws.close();
                        
                        resultsDiv.innerHTML = `
                            <div class="info-box">
                                <strong>✅ 连接测试成功</strong>
                                <p>WebSocket URL: <span class="code">${wsUrl}</span></p>
                                <p>认证状态: <span class="status-ok">成功</span></p>
                            </div>
                        `;
                        updateSuggestions('success');
                    }

                    if (data.type === 'res' && data.error) {
                        ws.close();
                        resultsDiv.innerHTML = `
                            <div class="warning-box">
                                <strong>❌ 认证失败</strong>
                                <p>错误码: ${data.error.code}</p>
                                <p>错误信息: ${data.error.message}</p>
                            </div>
                        `;
                        updateSuggestions('auth-failed');
                    }
                };

                ws.onerror = (error) => {
                    resultsDiv.innerHTML = `
                        <div class="warning-box">
                            <strong>❌ 连接失败</strong>
                            <p>无法连接到 WebSocket 服务器</p>
                            <p>URL: <span class="code">${wsUrl}</span></p>
                        </div>
                    `;
                    updateSuggestions('connection-failed');
                };

            } catch (error) {
                resultsDiv.innerHTML = `
                    <div class="warning-box">
                        <strong>❌ 连接错误</strong>
                        <p>${error.message}</p>
                    </div>
                `;
                updateSuggestions('error');
            }
        };

        // 更新建议
        function updateSuggestions(status) {
            const suggestionsDiv = document.getElementById('suggestions');
            
            const suggestions = {
                'missing-env': `
                    <div class="warning-box">
                        <h3>🔧 环境变量缺失</h3>
                        <p><strong>问题</strong>: .env 文件配置不正确或未加载</p>
                        <p><strong>解决方法</strong>:</p>
                        <ol>
                            <li>检查 <span class="code">.env</span> 文件是否存在</li>
                            <li>确认包含以下配置:</li>
                        </ol>
                        <pre style="background: #f0f0f0; padding: 10px; border-radius: 5px; margin-top: 10px;">
VITE_PC_WEBSOCKET_URL=ws://192.168.101.4:18789
VITE_PC_AUTH_TOKEN=8743d26357758f202c9bb5a21db706185d66f9c98f9c3ff1</pre>
                        <ol start="3">
                            <li>重启开发服务器: <span class="code">Ctrl+C</span> 然后 <span class="code">npm run dev</span></li>
                        </ol>
                    </div>
                `,
                'connection-failed': `
                    <div class="warning-box">
                        <h3>🔌 连接失败</h3>
                        <p><strong>可能原因</strong>:</p>
                        <ul>
                            <li>Gateway 未运行</li>
                            <li>防火墙阻止连接</li>
                            <li>IP 地址不正确</li>
                        </ul>
                        <p><strong>解决方法</strong>:</p>
                        <ol>
                            <li>确认 Gateway 正在运行: <span class="code">openclaw-cn gateway</span></li>
                            <li>检查防火墙规则</li>
                            <li>验证 IP 地址: <span class="code">ipconfig</span></li>
                        </ol>
                    </div>
                `,
                'auth-failed': `
                    <div class="warning-box">
                        <h3>🔑 认证失败</h3>
                        <p><strong>可能原因</strong>:</p>
                        <ul>
                            <li>Token 不正确</li>
                            <li>Client ID 不匹配</li>
                        </ul>
                        <p><strong>解决方法</strong>:</p>
                        <ol>
                            <li>检查 .env 中的 VITE_PC_AUTH_TOKEN</li>
                            <li>确认 Token 与 Gateway 配置一致</li>
                        </ol>
                    </div>
                `,
                'success': `
                    <div class="info-box">
                        <h3>✅ 配置正确</h3>
                        <p>环境变量加载正常，连接和认证都成功。</p>
                        <p><strong>如果 TRIX App 仍然无法连接</strong>:</p>
                        <ul>
                            <li>检查浏览器控制台是否有其他错误</li>
                            <li>确认应用代码中正确使用了 import.meta.env</li>
                            <li>清除浏览器缓存并刷新</li>
                        </ul>
                    </div>
                `,
                'error': `
                    <div class="warning-box">
                        <h3>⚠️ 发生错误</h3>
                        <p>请查看浏览器控制台获取详细错误信息</p>
                    </div>
                `
            };

            suggestionsDiv.innerHTML = suggestions[status] || suggestions['error'];
        }

        // 页面加载时检查
        window.onload = () => {
            checkEnvironment();
        };
    </script>
</body>
</html>
