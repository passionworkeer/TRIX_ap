<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gateway 直接连接测试</title>
    <style>
        body {
            font-family: monospace;
            padding: 20px;
            background: #1e1e1e;
            color: #d4d4d4;
        }
        .log {
            background: #2d2d2d;
            padding: 15px;
            border-radius: 5px;
            margin: 10px 0;
            max-height: 600px;
            overflow-y: auto;
        }
        .log-entry {
            margin: 5px 0;
            padding: 5px;
            border-left: 3px solid #007acc;
            padding-left: 10px;
        }
        .error { border-left-color: #f44336; color: #f44336; }
        .success { border-left-color: #4caf50; color: #4caf50; }
        .info { border-left-color: #2196f3; color: #2196f3; }
        button {
            padding: 10px 20px;
            margin: 5px;
            font-size: 14px;
            cursor: pointer;
            background: #007acc;
            color: white;
            border: none;
            border-radius: 3px;
        }
        button:hover { background: #005a9e; }
        .header {
            background: #007acc;
            color: white;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h2>🔍 Gateway 直接连接测试</h2>
        <p>测试原始 WebSocket 连接,不通过 React 应用</p>
    </div>

    <div>
        <button onclick="testBasicConnection()">1️⃣ 测试基础连接</button>
        <button onclick="testWithHeaders()">2️⃣ 测试带 Headers</button>
        <button onclick="testProtocol()">3️⃣ 测试完整协议</button>
        <button onclick="clearLogs()">🗑️ 清空日志</button>
    </div>

    <div class="log" id="log"></div>

    <script>
        const wsUrl = 'ws://192.168.101.4:18789';
        const authToken = 'REDACTED_CLAWBOT_GATEWAY_TOKEN';

        function log(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;
            console.log(message);
        }

        function clearLogs() {
            document.getElementById('log').innerHTML = '';
        }

        // 测试 1: 最基础的连接
        function testBasicConnection() {
            log('=== 测试 1: 基础 WebSocket 连接 ===', 'info');
            log(`连接到: ${wsUrl}`, 'info');

            const ws = new WebSocket(wsUrl);
            
            ws.onopen = () => {
                log('✅ WebSocket 连接已打开!', 'success');
                log('等待接收消息...', 'info');
            };

            ws.onmessage = (event) => {
                log(`📥 收到消息: ${event.data}`, 'success');
                try {
                    const data = JSON.parse(event.data);
                    log(`📦 解析后: ${JSON.stringify(data, null, 2)}`, 'info');
                } catch (e) {
                    log(`⚠️ 不是 JSON 格式`, 'info');
                }
            };

            ws.onerror = (error) => {
                log(`❌ WebSocket 错误: ${error.message || '未知错误'}`, 'error');
                console.error('详细错误:', error);
            };

            ws.onclose = (event) => {
                log(`🔌 连接关闭: code=${event.code}, reason=${event.reason || '(空)'}`, 'error');
                log(`wasClean=${event.wasClean}`, 'info');
            };

            // 30 秒后关闭
            setTimeout(() => {
                if (ws.readyState === WebSocket.OPEN) {
                    log('⏰ 30秒超时,关闭连接', 'info');
                    ws.close();
                }
            }, 30000);
        }

        // 测试 2: 带自定义 Headers (虽然 WebSocket 不支持,但可以看错误)
        function testWithHeaders() {
            log('=== 测试 2: 尝试带 Headers 连接 ===', 'info');
            log('注意: WebSocket 构造函数不支持自定义 headers', 'info');
            log('但可以通过 protocols 参数尝试', 'info');

            try {
                // WebSocket 构造函数的第二个参数是 protocols
                const ws = new WebSocket(wsUrl, ['websocket']);
                
                ws.onopen = () => {
                    log('✅ WebSocket 连接已打开!', 'success');
                };

                ws.onmessage = (event) => {
                    log(`📥 收到消息: ${event.data}`, 'success');
                };

                ws.onerror = (error) => {
                    log(`❌ WebSocket 错误`, 'error');
                    console.error('详细错误:', error);
                };

                ws.onclose = (event) => {
                    log(`🔌 连接关闭: code=${event.code}, reason=${event.reason || '(空)'}`, 'error');
                };
            } catch (e) {
                log(`❌ 创建 WebSocket 失败: ${e.message}`, 'error');
            }
        }

        // 测试 3: 完整协议流程
        function testProtocol() {
            log('=== 测试 3: Clawdbot 完整协议 ===', 'info');
            log(`连接到: ${wsUrl}`, 'info');

            const ws = new WebSocket(wsUrl);
            let connectionPhase = 'CONNECTING';

            ws.onopen = () => {
                log('✅ WebSocket 连接已打开!', 'success');
                connectionPhase = 'WAIT_CHALLENGE';
                log('等待 connect.challenge...', 'info');
            };

            ws.onmessage = (event) => {
                log(`📥 收到消息: ${event.data}`, 'info');
                
                try {
                    const data = JSON.parse(event.data);
                    log(`📦 解析数据: ${JSON.stringify(data, null, 2)}`, 'info');

                    if (data.event === 'connect.challenge') {
                        log('🔑 收到 Challenge 请求!', 'success');
                        connectionPhase = 'SEND_AUTH';

                        const nonce = data.payload?.nonce;
                        if (!nonce) {
                            log('❌ Challenge 中没有 nonce!', 'error');
                            log(`完整 payload: ${JSON.stringify(data.payload)}`, 'error');
                            return;
                        }

                        log(`Nonce: ${nonce}`, 'info');

                        const response = {
                            type: 'req',
                            id: nonce,
                            method: 'connect',
                            params: {
                                minProtocol: 3,
                                maxProtocol: 3,
                                role: 'operator',
                                client: {
                                    id: 'clawdbot-ios',
                                    mode: 'webchat',
                                    platform: 'web',
                                    displayName: 'TRIX Companion',
                                    version: '1.0.0',
                                    instanceId: Math.random().toString(36).substring(2, 15)
                                },
                                caps: [],
                                auth: {
                                    token: authToken
                                }
                            }
                        };

                        log('📤 发送认证响应:', 'info');
                        log(JSON.stringify(response, null, 2), 'info');
                        
                        ws.send(JSON.stringify(response));
                        connectionPhase = 'WAIT_AUTH_RESULT';
                    } 
                    else if (data.type === 'res') {
                        if (data.error) {
                            log(`❌ 收到错误响应: ${data.error.code} - ${data.error.message}`, 'error');
                            log(`完整错误: ${JSON.stringify(data.error, null, 2)}`, 'error');
                            connectionPhase = 'AUTH_FAILED';
                        } else if (data.event === 'hello-ok') {
                            log('🎉 认证成功! 收到 hello-ok', 'success');
                            connectionPhase = 'AUTHENTICATED';
                        } else {
                            log(`📨 收到响应: ${JSON.stringify(data, null, 2)}`, 'info');
                        }
                    }
                    else {
                        log(`📨 其他消息: ${JSON.stringify(data, null, 2)}`, 'info');
                    }
                } catch (e) {
                    log(`⚠️ 消息解析失败: ${e.message}`, 'error');
                    log(`原始消息: ${event.data}`, 'error');
                }
            };

            ws.onerror = (error) => {
                log(`❌ WebSocket 错误 (阶段: ${connectionPhase})`, 'error');
                console.error('详细错误:', error);
            };

            ws.onclose = (event) => {
                log(`🔌 连接关闭 (阶段: ${connectionPhase})`, 'error');
                log(`code=${event.code}, reason=${event.reason || '(空)'}`, 'error');
                log(`wasClean=${event.wasClean}`, 'info');
                
                if (event.code === 1006) {
                    log('💡 Code 1006 通常表示:', 'info');
                    log('  - 连接异常关闭(没有收到关闭帧)', 'info');
                    log('  - 服务器主动断开连接', 'info');
                    log('  - 网络问题导致连接中断', 'info');
                }
            };
        }

        // 页面加载时显示提示
        window.onload = () => {
            log('🚀 Gateway 连接测试工具已就绪', 'success');
            log(`目标: ${wsUrl}`, 'info');
            log('点击按钮开始测试', 'info');
            log('', 'info');
        };
    </script>
</body>
</html>
