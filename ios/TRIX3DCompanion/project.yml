name: TRIX3DCompanion
options:
  bundleIdPrefix: com.trix3d
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: NO
    INFOPLIST_FILE: Resources/Info.plist
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64

targets:
  TRIX3DCompanion:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Core
      - path: Features
        excludes:
          - "**/README.md"
          - "**/PersistenceIntegrationExample.swift"
      - path: Shared
        excludes:
          - "**/README.md"
      - path: Resources
        excludes:
          - "**/README.md"
          - "**/.gitkeep"
    dependencies:
      - package: Supabase
      - package: Alamofire
      - package: Starscream
      - package: Kingfisher
      - package: KeychainAccess
      - package: SQLite
      - package: CodeScanner
      - package: Firebase
        product: FirebaseAnalytics
      - package: Firebase
        product: FirebasePerformance
      - package: Sentry
      - package: SocketIO
      - package: PopupView
      - package: WhatsNewKit
      - package: ActivityIndicatorView
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.trix3d.companion
        INFOPLIST_FILE: Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        ENABLE_PREVIEWS: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        SWIFT_EMIT_LOC_STRINGS: YES
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO

  TRIX3DCompanionTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/TRIX3DCompanionTests/Smoke
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.trix3d.companion.tests
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        TEST_TARGET_NAME: TRIX3DCompanion
    dependencies:
      - target: TRIX3DCompanion

  TRIX3DUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ../TRIX3DUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.trix3d.companion.uitests
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        TEST_TARGET_NAME: TRIX3DCompanion
    dependencies:
      - target: TRIX3DCompanion

schemes:
  TRIX3DCompanion:
    build:
      targets:
        TRIX3DCompanion: all
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - TRIX3DCompanionTests
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  TRIX3DCompanion-AppOnly:
    build:
      targets:
        TRIX3DCompanion: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  TRIX3DCompanion-VisualUI:
    build:
      targets:
        TRIX3DCompanion: all
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - TRIX3DUITests
    run:
      config: Debug
    analyze:
      config: Debug

packages:
  Supabase:
    url: https://github.com/supabase-community/supabase-swift.git
    from: "1.0.0"
  Alamofire:
    url: https://github.com/Alamofire/Alamofire.git
    from: "5.8.0"
  Starscream:
    url: https://github.com/daltoniam/Starscream.git
    from: "4.0.0"
  Kingfisher:
    url: https://github.com/onevcat/Kingfisher.git
    from: "7.10.0"
  KeychainAccess:
    url: https://github.com/kishikawakatsumi/KeychainAccess.git
    from: "4.2.0"
  SQLite:
    url: https://github.com/stephencelis/SQLite.swift.git
    from: "0.14.0"
  CodeScanner:
    url: https://github.com/twostraws/CodeScanner.git
    from: "2.0.0"
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "11.0.0"
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa.git
    from: "8.0.0"
  SocketIO:
    url: https://github.com/socketio/socket.io-client-swift.git
    from: "16.0.0"
  PopupView:
    url: https://github.com/exyte/PopupView.git
    from: "4.1.0"
  WhatsNewKit:
    url: https://github.com/SvenTiigi/WhatsNewKit.git
    from: "1.0.0"
  ActivityIndicatorView:
    url: https://github.com/exyte/ActivityIndicatorView.git
    from: "1.0.0"

entitlements:
  path: TRIX3DCompanion.entitlements
  properties:
    aps-environment: development
    com.apple.developer.applesignin:
      - Default
