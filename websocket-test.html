<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket 连接测试工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
            font-size: 14px;
        }

        .content {
            padding: 30px;
        }

        .test-section {
            margin-bottom: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            border-left: 4px solid #667eea;
        }

        .test-section h2 {
            color: #333;
            margin-bottom: 15px;
            font-size: 20px;
        }

        .test-item {
            margin-bottom: 15px;
            padding: 15px;
            background: white;
            border-radius: 8px;
            border: 1px solid #e0e0e0;
        }

        .test-label {
            font-weight: 600;
            color: #555;
            margin-bottom: 8px;
            display: block;
        }

        .test-url {
            font-family: 'Courier New', monospace;
            background: #f0f0f0;
            padding: 10px;
            border-radius: 5px;
            font-size: 14px;
            margin-bottom: 10px;
            word-break: break-all;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-success {
            background: #10b981;
            color: white;
        }

        .btn-danger {
            background: #ef4444;
            color: white;
        }

        .btn-disconnect {
            background: #f59e0b;
            color: white;
            margin-left: 10px;
        }

        .status {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-left: 10px;
        }

        .status-disconnected {
            background: #fee2e2;
            color: #dc2626;
        }

        .status-connecting {
            background: #fef3c7;
            color: #d97706;
        }

        .status-connected {
            background: #d1fae5;
            color: #059669;
        }

        .status-error {
            background: #fee2e2;
            color: #dc2626;
        }

        .log-container {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 20px;
            border-radius: 8px;
            max-height: 400px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.6;
        }

        .log-entry {
            margin-bottom: 8px;
            padding: 5px;
            border-radius: 3px;
        }

        .log-info {
            color: #4fc3f7;
        }

        .log-success {
            color: #66bb6a;
            background: rgba(102, 187, 106, 0.1);
        }

        .log-error {
            color: #ef5350;
            background: rgba(239, 83, 80, 0.1);
        }

        .log-warning {
            color: #ffa726;
        }

        .log-time {
            color: #999;
            margin-right: 10px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .stat-card {
            background: white;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #e0e0e0;
        }

        .stat-label {
            font-size: 12px;
            color: #888;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 24px;
            font-weight: 700;
            color: #667eea;
        }

        .message-input {
            width: 100%;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            font-size: 14px;
            margin-bottom: 10px;
            transition: border 0.3s;
        }

        .message-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .clear-btn {
            background: #6b7280;
            color: white;
            padding: 8px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
            margin-top: 10px;
        }

        .clear-btn:hover {
            background: #4b5563;
        }

        @media (max-width: 768px) {
            .container {
                margin: 10px;
            }
            
            .content {
                padding: 15px;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔌 WebSocket 连接诊断工具</h1>
            <p>测试 localhost vs 局域网 IP 的连接差异</p>
        </div>

        <div class="content">
            <!-- 测试 1: localhost -->
            <div class="test-section">
                <h2>测试 1️⃣ : localhost 连接</h2>
                <div class="test-item">
                    <span class="test-label">WebSocket URL:</span>
                    <div class="test-url" id="url-localhost">ws://localhost:18789</div>
                    <button class="btn btn-primary" onclick="connectTest('localhost')">
                        连接测试
                    </button>
                    <button class="btn btn-disconnect" onclick="disconnectTest('localhost')">
                        断开
                    </button>
                    <span class="status status-disconnected" id="status-localhost">未连接</span>
                </div>
            </div>

            <!-- 测试 2: 局域网 IP -->
            <div class="test-section">
                <h2>测试 2️⃣ : 局域网 IP 连接</h2>
                <div class="test-item">
                    <span class="test-label">WebSocket URL:</span>
                    <div class="test-url" id="url-network">ws://192.168.101.4:18789</div>
                    <button class="btn btn-primary" onclick="connectTest('network')">
                        连接测试
                    </button>
                    <button class="btn btn-disconnect" onclick="disconnectTest('network')">
                        断开
                    </button>
                    <span class="status status-disconnected" id="status-network">未连接</span>
                </div>
            </div>

            <!-- 消息发送测试 -->
            <div class="test-section">
                <h2>📨 消息发送测试</h2>
                <div class="test-item">
                    <span class="test-label">选择连接:</span>
                    <select id="send-target" style="padding: 8px; border-radius: 5px; margin-bottom: 10px;">
                        <option value="localhost">localhost</option>
                        <option value="network">局域网 IP</option>
                    </select>
                    <input type="text" class="message-input" id="message-input" placeholder="输入测试消息，例如: 你好">
                    <button class="btn btn-primary" onclick="sendTestMessage()">
                        发送消息
                    </button>
                </div>
            </div>

            <!-- 统计信息 -->
            <div class="test-section">
                <h2>📊 连接统计</h2>
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-label">localhost 连接耗时</div>
                        <div class="stat-value" id="stat-localhost-time">-</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">局域网 IP 连接耗时</div>
                        <div class="stat-value" id="stat-network-time">-</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">localhost 消息数</div>
                        <div class="stat-value" id="stat-localhost-msgs">0</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">局域网 IP 消息数</div>
                        <div class="stat-value" id="stat-network-msgs">0</div>
                    </div>
                </div>
            </div>

            <!-- 日志输出 -->
            <div class="test-section">
                <h2>📝 实时日志</h2>
                <div class="log-container" id="log-container">
                    <div class="log-entry log-info">等待连接测试...</div>
                </div>
                <button class="clear-btn" onclick="clearLogs()">清除日志</button>
            </div>
        </div>
    </div>

    <script>
        // 全局状态
        const connections = {
            localhost: null,
            network: null
        };

        const stats = {
            localhost: { startTime: 0, messages: 0 },
            network: { startTime: 0, messages: 0 }
        };

        const AUTH_TOKEN = '8743d26357758f202c9bb5a21db706185d66f9c98f9c3ff1';

        // 日志函数
        function log(message, type = 'info', testType = 'system') {
            const logContainer = document.getElementById('log-container');
            const time = new Date().toLocaleTimeString();
            const entry = document.createElement('div');
            entry.className = `log-entry log-${type}`;
            entry.innerHTML = `<span class="log-time">[${time}]</span><strong>[${testType}]</strong> ${message}`;
            logContainer.appendChild(entry);
            logContainer.scrollTop = logContainer.scrollHeight;
        }

        // 更新状态显示
        function updateStatus(testType, status, message = '') {
            const statusEl = document.getElementById(`status-${testType}`);
            statusEl.className = `status status-${status}`;
            const statusText = {
                'disconnected': '未连接',
                'connecting': '连接中...',
                'connected': '已连接',
                'error': '错误'
            };
            statusEl.textContent = statusText[status] + (message ? ` (${message})` : '');
        }

        // 生成唯一 ID
        function generateId() {
            return Math.random().toString(36).substring(7);
        }

        // 连接测试
        function connectTest(testType) {
            // 如果已经连接，先断开
            if (connections[testType]) {
                disconnectTest(testType);
            }

            const urls = {
                'localhost': 'ws://localhost:18789',
                'network': 'ws://192.168.101.4:18789'
            };

            const url = urls[testType];
            log(`开始连接到 ${url}`, 'info', testType);
            updateStatus(testType, 'connecting');

            // 记录开始时间
            stats[testType].startTime = Date.now();

            try {
                const ws = new WebSocket(url);
                connections[testType] = ws;

                ws.onopen = () => {
                    const connectTime = Date.now() - stats[testType].startTime;
                    log(`✅ WebSocket 连接成功！耗时: ${connectTime}ms`, 'success', testType);
                    updateStatus(testType, 'connected', `${connectTime}ms`);
                    document.getElementById(`stat-${testType}-time`).textContent = `${connectTime}ms`;
                    
                    // 连接成功后，等待 challenge
                    log(`等待 challenge 消息...`, 'info', testType);
                };

                ws.onmessage = (event) => {
                    stats[testType].messages++;
                    document.getElementById(`stat-${testType}-msgs`).textContent = stats[testType].messages;

                    try {
                        const data = JSON.parse(event.data);
                        log(`📨 收到消息: ${event.data}`, 'info', testType);

                        // 处理 challenge
                        if (data.event === 'connect.challenge') {
                            log(`🎯 收到 challenge，准备响应...`, 'warning', testType);
                            
                            const challengeId = data.payload?.nonce || data.id || generateId();
                            const response = {
                                type: 'req',
                                id: challengeId,
                                method: 'connect',
                                params: {
                                    minProtocol: 3,
                                    maxProtocol: 3,
                                    role: 'operator',
                                    client: {
                                        id: 'clawdbot-ios',  // ✅ 修复：使用正确的 client ID
                                        mode: 'webchat',
                                        platform: 'ios',
                                        displayName: 'TRIX Test Tool',
                                        version: '1.0.0',
                                        instanceId: generateId()
                                    },
                                    caps: [],
                                    auth: { token: AUTH_TOKEN }
                                }
                            };

                            log(`📤 发送 challenge 响应: ${JSON.stringify(response)}`, 'info', testType);
                            ws.send(JSON.stringify(response));
                        }

                        // 处理认证成功
                        if (data.type === 'res' && data.payload?.type === 'hello-ok') {
                            log(`🟢 认证成功！连接已建立`, 'success', testType);
                            updateStatus(testType, 'connected', '认证成功');
                        }

                        // 处理认证失败
                        if (data.type === 'res' && !data.ok && data.error) {
                            log(`❌ 认证失败: ${data.error.code} - ${data.error.message}`, 'error', testType);
                            updateStatus(testType, 'error', data.error.message);
                        }

                        // 处理 AI 回复
                        if (data.payload?.stream === 'assistant') {
                            const text = data.payload.data?.delta || data.payload.data?.text;
                            if (text) {
                                log(`💬 AI 回复: ${text}`, 'success', testType);
                            }
                        }

                    } catch (e) {
                        log(`⚠️ 消息解析错误: ${e.message}`, 'warning', testType);
                    }
                };

                ws.onerror = (error) => {
                    log(`❌ WebSocket 错误: ${error}`, 'error', testType);
                    updateStatus(testType, 'error', '连接错误');
                };

                ws.onclose = (event) => {
                    log(`🔌 连接关闭: code=${event.code}, reason=${event.reason}`, 'warning', testType);
                    updateStatus(testType, 'disconnected', `code ${event.code}`);
                    connections[testType] = null;
                };

            } catch (error) {
                log(`❌ 连接创建失败: ${error.message}`, 'error', testType);
                updateStatus(testType, 'error', error.message);
            }
        }

        // 断开连接
        function disconnectTest(testType) {
            if (connections[testType]) {
                connections[testType].close(1000, 'User disconnect');
                connections[testType] = null;
                log(`断开连接`, 'info', testType);
                updateStatus(testType, 'disconnected');
            }
        }

        // 发送测试消息
        function sendTestMessage() {
            const target = document.getElementById('send-target').value;
            const message = document.getElementById('message-input').value.trim();

            if (!message) {
                log(`请输入消息内容`, 'error', 'message');
                return;
            }

            if (!connections[target] || connections[target].readyState !== WebSocket.OPEN) {
                log(`请先连接到 ${target}`, 'error', 'message');
                return;
            }

            const packet = {
                type: 'req',
                id: `msg-${Date.now()}-${generateId()}`,
                method: 'agent',
                params: {
                    message: message,
                    to: 'self',
                    idempotencyKey: `${Date.now()}-${generateId()}`
                }
            };

            log(`📤 发送消息: ${message}`, 'info', target);
            connections[target].send(JSON.stringify(packet));
            document.getElementById('message-input').value = '';
        }

        // 清除日志
        function clearLogs() {
            document.getElementById('log-container').innerHTML = '<div class="log-entry log-info">日志已清除</div>';
        }

        // 页面加载时的初始化
        window.onload = () => {
            log(`🚀 WebSocket 诊断工具已就绪`, 'success', 'system');
            log(`📝 请分别测试 localhost 和 局域网 IP 的连接`, 'info', 'system');
            log(`🔑 Auth Token: ${AUTH_TOKEN}`, 'info', 'system');
        };
    </script>
</body>
</html>
